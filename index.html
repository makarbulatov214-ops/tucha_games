
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tucha Games</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b1225;color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#111b32;border-bottom:1px solid #263550}
.logo{font-weight:900;font-size:20px}.logo span{display:block;color:#facc15;font-size:12px}
.balance{background:#202d45;padding:10px 14px;border-radius:12px;font-weight:bold}
main{padding:14px;padding-bottom:100px;max-width:520px;margin:auto}
.tab{display:none}.tab.active{display:block}
.panel{background:#152139;border:1px solid #293953;border-radius:20px;padding:16px;margin-bottom:14px}
.rocket-area{height:280px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#203e70,#111b30 72%);border:1px solid #2a3d5d;border-radius:22px;margin:12px 0 16px}
#rocket-wrap{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:2}
#rocket{width:120px;height:120px;object-fit:contain;display:block;filter:drop-shadow(0 0 15px #38bdf8)}
#rocket.flying{animation:float .45s ease-in-out infinite alternate}
#rocket.crashed{animation:none;transform:rotate(140deg);filter:grayscale(1);opacity:.65}
@keyframes float{from{translate:0 3px;rotate:-3deg}to{translate:0 -8px;rotate:5deg}}
#crash-status{z-index:3;font-size:32px;font-weight:900;text-shadow:0 3px 12px #000}
.primary{width:100%;padding:15px;border:0;border-radius:13px;border-bottom:4px solid #0004;background:#3b82f6;color:#fff;font-weight:900;font-size:16px}
.primary.green{background:#16a34a}.primary.red{background:#dc2626}.primary.gold{background:#d97706}
.primary:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
input[type=number]{width:100%;background:#0b1427;border:1px solid #34445e;color:#fff;border-radius:12px;padding:14px;font-size:22px;text-align:center;margin:10px 0 14px;outline:none}
.history{display:flex;gap:7px;overflow:auto;margin-bottom:12px}
.history span{background:#202d45;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:bold}
.players{display:grid;gap:7px;margin-top:10px}
.player{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#101b30;border-radius:10px;font-size:13px}
.player.you{border:1px solid #3b82f6;background:#172e50}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0 18px}
.cell{aspect-ratio:1;min-width:0;border:0;border-radius:12px;background:linear-gradient(145deg,#344760,#1d2b42);border-bottom:4px solid #101a2b;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center}
.cell.safe{background:linear-gradient(145deg,#2563eb,#1d4ed8);border-color:#163c91}
.cell.bomb{background:linear-gradient(145deg,#ef4444,#991b1b);border-color:#701818}
.cell img{width:78%;height:78%;object-fit:contain}
.range-row{display:flex;justify-content:space-between;margin:14px 0;font-weight:bold}
input[type=range]{width:100%;accent-color:#facc15}
.multiplier{text-align:center;color:#4ade80;font-weight:bold;font-size:19px;margin:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#101a2d;border-top:1px solid #293953;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}
nav button{background:none;border:0;color:#8190aa;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:bold}
nav button.active{color:#60a5fa}
.nav-icon{font-size:24px;height:28px}
.note{color:#91a1bb;font-size:12px;text-align:center;margin-top:12px}
.profile{text-align:center;padding-top:30px}
.avatar{font-size:60px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div class="logo">☁️ TUCHA<span>GAMES</span></div>
  <div class="balance">$ <span id="header-balance">1.00</span></div>
</header>

<main>
<section id="tab-crash" class="tab active">
  <div class="history" id="crash-history">
    <span>1.45x</span><span>2.80x</span><span>1.12x</span>
  </div>

  <div class="rocket-area">
    <div id="rocket-wrap">
      <img id="rocket" class="flying" src="./rocket.gif.gif" alt="Rocket">
    </div>
    <div id="crash-status">ОЖИДАНИЕ</div>
  </div>

  <div class="panel">
    <label for="crash-bet">Сумма ставки ($)</label>
    <input id="crash-bet" type="number" min="0.01" step="0.01" value="0.10">
    <button id="crash-button" class="primary" onclick="handleCrashAction()">СДЕЛАТЬ СТАВКУ</button>
  </div>

  <div class="panel">
    <b>Игроки и их ставки</b>
    <div id="live-bets" class="players"></div>
  </div>
</section>

<section id="tab-mines" class="tab">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>💣 МИНЫ</b>
      <span id="mines-state-label" style="color:#9caec9">Новая игра</span>
    </div>

    <div id="mines-grid" class="grid"></div>

    <label for="mines-bet">Сумма ставки ($)</label>
    <input id="mines-bet" type="number" min="0.01" step="0.01" value="0.10">

    <div class="range-row">
      <span>Количество мин</span>
      <span id="mines-count">3</span>
    </div>

    <input id="mines-slider" type="range" min="1" max="24" value="3"
      oninput="document.getElementById('mines-count').textContent=this.value">

    <div id="mines-multiplier" class="multiplier" style="display:none">
      Коэффициент: <span id="mine-mult">1.00</span>x
    </div>

    <button id="mines-button" class="primary" onclick="handleMinesAction()">СТАРТ</button>
    <div class="note">После завершения раунда поле очищается. Новый раунд начинается по кнопке.</div>
  </div>
</section>

<section id="tab-profile" class="tab">
  <div class="panel profile">
    <div class="avatar" id="avatar">👤</div>
    <h2 id="username">Игрок</h2>
    <div class="balance" style="display:inline-block;margin:12px">
      $ <span id="profile-balance">1.00</span>
    </div>
    <button class="primary green" id="bonus-button" onclick="claimBonus()">
      🎁 Забрать $1.00 (<span id="bonus-left">2</span>/2)
    </button>
    <p class="note">Демо-баланс хранится в браузере.</p>
  </div>
</section>
</main>

<nav>
  <button class="active" data-tab="crash" onclick="switchTab('crash')"><span class="nav-icon">🚀</span>КРАШ</button>
  <button data-tab="mines" onclick="switchTab('mines')"><span class="nav-icon">💣</span>МИНЫ</button>
  <button data-tab="profile" onclick="switchTab('profile')"><span class="nav-icon">👤</span>ПРОФИЛЬ</button>
</nav>

<script>
const tg=window.Telegram?.WebApp;
try{
  tg?.ready();
  tg?.expand();
  tg?.setHeaderColor('#111b32');
  tg?.setBackgroundColor('#0b1225');
}catch(e){}

const user=tg?.initDataUnsafe?.user;
const key='tucha-demo-'+(user?.id??'demo');
let saved={};
try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
let balance=saved.balance!==undefined?Number(saved.balance):1;
let bonusCount=Number(saved.bonusCount)||0;
const $=id=>document.getElementById(id);
const money=n=>Number(n).toFixed(2);

function save(){
  localStorage.setItem(key,JSON.stringify({balance,bonusCount}));
}
function updateBalance(){
  $('header-balance').textContent=money(balance);
  $('profile-balance').textContent=money(balance);
  $('bonus-left').textContent=Math.max(0,2-bonusCount);
  $('bonus-button').style.display=bonusCount>=2?'none':'block';
  save();
}
$('username').textContent=user?.first_name||'Игрок';
if(user?.photo_url){
  $('avatar').innerHTML='';
  const avatarImg=document.createElement('img');
  avatarImg.src=user.photo_url;
  avatarImg.style.cssText='width:90px;height:90px;border-radius:50%;object-fit:cover';
  $('avatar').append(avatarImg);
}
function haptic(type='light'){
  try{tg?.HapticFeedback?.impactOccurred(type)}catch(e){}
}
function notify(type='success'){
  try{tg?.HapticFeedback?.notificationOccurred(type)}catch(e){}
}
function switchTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id==='tab-'+name));
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));
  haptic();
}
function claimBonus(){
  if(bonusCount>=2)return;
  balance+=1;
  bonusCount++;
  updateBalance();
  notify('success');
}
function readBet(id){
  const n=Number($(id).value);
  if(!Number.isFinite(n)||n<=0||Math.round(n*100)!==n*100||n>balance){
    alert('Проверь ставку и баланс.');
    return null;
  }
  return Math.round(n*100)/100;
}

/* КРАШ */
let crashState='waiting',crashBet=0,inCrash=false,mult=1,target=2;
let crashTimer=null,crashTick=null,crashRoundTimer=null;
const rocket=$('rocket');
rocket.addEventListener('error',()=>{
  rocket.alt='Не удалось загрузить rocket.gif.gif';
});
function fakeBets(){
  const names=['Саня','CryptoKing','Маша99','DarkPro','Иван','TuchaFan','Макс','Алекс','Lucky','Роман'];
  $('live-bets').innerHTML='';
  const rows=[];
  if(inCrash)rows.push({name:user?.first_name||'Вы',amount:crashBet,you:true});
  for(let i=0;i<5+Math.floor(Math.random()*4);i++){
    rows.push({name:names[Math.floor(Math.random()*names.length)],amount:Math.round((.1+Math.random()*2.5)*100)/100});
  }
  rows.forEach(p=>{
    const row=document.createElement('div');
    row.className='player'+(p.you?' you':'');
    const left=document.createElement('span');
    left.textContent=(p.you?'👤 ':'👥 ')+p.name;
    const right=document.createElement('b');
    right.textContent='$'+money(p.amount);
    right.style.color=p.you?'#4ade80':'#facc15';
    row.append(left,right);
    $('live-bets').append(row);
  });
}
function startCrashLoop(){
  clearInterval(crashTimer);
  clearInterval(crashTick);
  clearTimeout(crashRoundTimer);
  crashState='waiting';
  inCrash=false;
  crashBet=0;
  mult=1;
  rocket.className='flying';
  rocket.style.transform='';
  $('crash-status').style.color='white';
  $('crash-button').disabled=false;
  $('crash-button').className='primary';
  $('crash-button').textContent='СДЕЛАТЬ СТАВКУ';
  let seconds=5;
  $('crash-status').textContent='СТАРТ ЧЕРЕЗ '+seconds;
  fakeBets();
  crashTimer=setInterval(()=>{
    seconds--;
    if(seconds>0){
      $('crash-status').textContent='СТАРТ ЧЕРЕЗ '+seconds;
    }else{
      clearInterval(crashTimer);
      flyCrash();
    }
  },1000);
}
function flyCrash(){
  crashState='flying';
  mult=1;
  target=Math.random()<.07?5+Math.random()*7:1.2+Math.random()*3.8;
  $('crash-status').textContent='1.00x';
  $('crash-button').disabled=!inCrash;
  $('crash-button').textContent=inCrash?'ЗАБРАТЬ $'+money(crashBet):'ПОЛЁТ...';
  crashTick=setInterval(()=>{
    mult+=.01;
    $('crash-status').textContent=mult.toFixed(2)+'x';
    if(inCrash){
      $('crash-button').textContent='ЗАБРАТЬ $'+money(crashBet*mult);
    }
    if(mult>=target)doCrash();
  },60);
}
function doCrash(){
  clearInterval(crashTick);
  crashState='crashed';
  rocket.className='crashed';
  rocket.style.transform='rotate(140deg)';
  $('crash-status').textContent='КРАШ '+target.toFixed(2)+'x';
  $('crash-status').style.color='#f87171';
  inCrash=false;
  $('crash-button').disabled=true;
  $('crash-button').textContent='РАУНД ЗАВЕРШЁН';
  const s=document.createElement('span');
  s.textContent=target.toFixed(2)+'x';
  $('crash-history').prepend(s);
  while($('crash-history').children.length>10)$('crash-history').lastElementChild.remove();
  notify('error');
  crashRoundTimer=setTimeout(()=>{
    $('crash-status').style.color='white';
    startCrashLoop();
  },3000);
}
function handleCrashAction(){
  if(crashState==='waiting'){
    const bet=readBet('crash-bet');
    if(bet===null)return;
    balance-=bet;
    crashBet=bet;
    inCrash=true;
    updateBalance();
    fakeBets();
    $('crash-button').textContent='СТАВКА ПРИНЯТА';
    $('crash-button').disabled=true;
    haptic('medium');
    return;
  }
  if(crashState==='flying'&&inCrash){
    const win=Math.floor(crashBet*mult*100)/100;
    balance+=win;
    inCrash=false;
    updateBalance();
    $('crash-button').disabled=true;
    $('crash-button').textContent='ВЫИГРАНО $'+money(win);
    $('crash-button').className='primary green';
    notify('success');
  }
}

/* МИНЫ */
let minesState='idle',minePositions=[],mineBet=0,mineMult=1,safeOpened=0,bombCount=3;
const grid=$('mines-grid');

function buildGrid(){
  grid.innerHTML='';
  for(let i=0;i<25;i++){
    const cell=document.createElement('button');
    cell.className='cell';
    cell.type='button';
    cell.dataset.index=i;
    cell.disabled=true;
    grid.append(cell);
  }
}
function resetMinesField(){
  buildGrid();
  minePositions=[];
  safeOpened=0;
  mineMult=1;
  $('mines-multiplier').style.display='none';
  $('mine-mult').textContent='1.00';
}
function renderCell(cell,type){
  cell.classList.add(type);
  cell.textContent='';
  if(type==='bomb'){
    const img=document.createElement('img');
    img.src='./bomb.png';
    img.alt='Мина';
    img.onerror=()=>{
      img.remove();
      cell.textContent='💣';
    };
    cell.append(img);
  }else{
    cell.textContent='💎';
  }
}
function startMines(){
  const bet=readBet('mines-bet');
  if(bet===null)return;
  bombCount=Number($('mines-slider').value);
  balance-=bet;
  updateBalance();
  mineBet=bet;
  mineMult=1;
  safeOpened=0;
  minePositions=[];
  while(minePositions.length<bombCount){
    const p=Math.floor(Math.random()*25);
    if(!minePositions.includes(p))minePositions.push(p);
  }
  buildGrid();
  minesState='playing';
  $('mines-state-label').textContent='Игра идёт';
  $('mines-multiplier').style.display='block';
  $('mine-mult').textContent='1.00';
  $('mines-slider').disabled=true;
  [...grid.children].forEach(cell=>{
    cell.disabled=false;
    cell.onclick=()=>clickMine(Number(cell.dataset.index),cell);
  });
  $('mines-button').disabled=false;
  $('mines-button').className='primary';
  $('mines-button').textContent='ЗАБРАТЬ ВЫИГРЫШ';
  haptic('medium');
}
function handleMinesAction(){
  if(minesState==='idle'||minesState==='finished'){
    // Поле очищается при старте следующего раунда.
    resetMinesField();
    $('mines-state-label').textContent='Новая игра';
    startMines();
    return;
  }
  if(minesState!=='playing')return;

  const win=Math.floor(mineBet*mineMult*100)/100;
  balance+=win;
  updateBalance();
  finishMines('ВЫИГРЫШ $'+money(win),'green');
  notify('success');
}
function clickMine(index,cell){
  if(minesState!=='playing'||cell.disabled)return;
  cell.disabled=true;

  if(minePositions.includes(index)){
    renderCell(cell,'bomb');
    [...grid.children].forEach((c,i)=>{
      c.disabled=true;
      if(minePositions.includes(i)&&i!==index)renderCell(c,'bomb');
    });
    finishMines('ПРОИГРЫШ','red');
    notify('error');
    return;
  }

  renderCell(cell,'safe');
  safeOpened++;
  haptic();

  let probability=1;
  for(let i=0;i<safeOpened;i++){
    probability*=(25-bombCount-i)/(25-i);
  }
  mineMult=.95/probability;
  $('mine-mult').textContent=mineMult.toFixed(2);
  $('mines-button').disabled=false;
  $('mines-button').textContent='ЗАБРАТЬ $'+money(mineBet*mineMult);
  $('mines-button').className='primary green';

  if(safeOpened===25-bombCount){
    const win=Math.floor(mineBet*mineMult*100)/100;
    balance+=win;
    updateBalance();
    finishMines('ВЫИГРЫШ $'+money(win),'gold');
    notify('success');
  }
}
function finishMines(message,color){
  minesState='finished';

  // Сразу очищаем поле после завершения раунда.
  resetMinesField();

  $('mines-state-label').textContent=message;
  $('mines-slider').disabled=false;
  $('mines-button').disabled=false;
  $('mines-button').textContent='СТАРТ НОВЫЙ РАУНД';
  $('mines-button').className='primary '+color;
}

buildGrid();
updateBalance();
fakeBets();
startCrashLoop();
</script>
</body>
</html>

```html
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Tucha Games</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {

            background:
                radial-gradient(
                    circle at 50% 0%,
                    #172554 0%,
                    #0f172a 42%,
                    #070b14 100%
                );

            color: white;

            user-select: none;

            font-family: 'Fredoka', sans-serif;

            overflow: hidden;
        }


        /* =========================================
           ЗВЁЗДЫ
        ========================================= */

        .stars {

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: .35;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.8) 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle,
                    rgba(255,255,255,.4) 1px,
                    transparent 1px
                );

            background-size:
                90px 90px,
                140px 140px;

            background-position:
                10px 20px,
                50px 80px;

            animation:
                starsMove 25s linear infinite;
        }

        @keyframes starsMove {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(100px);
            }

        }


        /* =========================================
           TABS
        ========================================= */

        .tab-content {

            display: none;

            padding-bottom: 105px;
        }

        .tab-content.active {

            display: block;
        }


        /* =========================================
           APP
        ========================================= */

        #app {

            position: relative;

            z-index: 10;

            width: 100%;

            height: calc(100vh - 65px);

            overflow-y: auto;

            overflow-x: hidden;

            padding: 12px;
        }

        #app::-webkit-scrollbar {
            display: none;
        }


        /* =========================================
           TOP BAR
        ========================================= */

        .top-bar {

            position: sticky;

            top: 0;

            z-index: 40;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 8px 4px 12px;

            background:
                rgba(7, 11, 22, .72);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .brand-cloud {

            width: 40px;

            height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 13px;

            background:
                rgba(59,130,246,.15);

            border:
                1px solid rgba(96,165,250,.18);

            font-size: 24px;
        }


        .brand-title {

            font-size: 18px;

            line-height: 18px;

            font-weight: 700;

            letter-spacing: .7px;
        }


        .brand-subtitle {

            color: #60a5fa;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1.4px;
        }


        .balance-box {

            display: flex;

            align-items: center;

            gap: 7px;

            padding:
                9px 13px;

            border-radius: 13px;

            background:
                rgba(30,41,59,.85);

            border:
                1px solid rgba(100,116,139,.22);
        }


        .balance-symbol {

            color: #4ade80;

            font-size: 17px;

            font-weight: 700;
        }


        .balance-value {

            font-size: 15px;

            font-weight: 700;
        }


        /* =========================================
           CRASH HISTORY
        ========================================= */

        .history {

            display: flex;

            gap: 6px;

            overflow-x: auto;

            padding:
                3px 1px 8px;

            scrollbar-width: none;
        }

        .history::-webkit-scrollbar {
            display: none;
        }


        .history-item {

            flex: 0 0 auto;

            padding:
                5px 11px;

            border-radius: 9px;

            background:
                rgba(30,41,59,.7);

            border:
                1px solid rgba(71,85,105,.25);

            font-size: 10px;

            font-weight: 700;
        }


        .history-low {

            color: #60a5fa;
        }


        .history-medium {

            color: #a78bfa;
        }


        .history-high {

            color: #4ade80;
        }


        /* =========================================
           CRASH GAME
        ========================================= */

        .crash-game {

            position: relative;

            width: 100%;

            height: 310px;

            overflow: hidden;

            border-radius: 25px;

            margin-bottom: 12px;

            background:
                radial-gradient(
                    circle at 50% 48%,
                    rgba(37,99,235,.16),
                    transparent 48%
                ),
                linear-gradient(
                    180deg,
                    rgba(15,23,42,.65),
                    rgba(8,13,25,.85)
                );

            border:
                1px solid rgba(71,85,105,.18);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.025),
                0 15px 40px rgba(0,0,0,.2);
        }


        .crash-game::before {

            content: "";

            position: absolute;

            left: 8%;

            right: 8%;

            bottom: 63px;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(59,130,246,.3),
                    transparent
                );
        }


        .crash-glow {

            position: absolute;

            left: 50%;

            top: 43%;

            width: 190px;

            height: 190px;

            transform:
                translate(-50%,-50%);

            background:
                radial-gradient(
                    circle,
                    rgba(37,99,235,.18),
                    transparent 70%
                );

            filter:
                blur(15px);

            pointer-events: none;
        }


        /* =========================================
           РАКЕТА
        ========================================= */

        #rocket-wrap {

            position: absolute;

            left: 50%;

            top: 43%;

            width: 145px;

            height: 145px;

            display: flex !important;

            align-items: center;

            justify-content: center;

            transform:
                translate(-50%,-50%);

            z-index: 8;
        }


        #rocket {

            display: block;

            width: 125px;

            height: 125px;

            object-fit: contain;

            object-position: center;

            margin: 0;

            padding: 0;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(59,130,246,.65)
                )
                drop-shadow(
                    0 12px 20px
                    rgba(0,0,0,.55)
                );

            transform-origin: center;

            z-index: 10;
        }


        #rocket.flying {

            animation:
                rocketFly .45s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes rocketFly {

            from {

                transform:
                    translateY(3px)
                    rotate(2deg);
            }

            to {

                transform:
                    translateY(-8px)
                    rotate(7deg);
            }

        }


        #rocket.crashed {

            animation: none;

            filter:
                grayscale(100%)
                opacity(.55)
                drop-shadow(
                    0 5px 10px
                    rgba(0,0,0,.65)
                );

            transform:
                rotate(145deg)
                translateY(12px);
        }


        /* =========================================
           КОЭФФИЦИЕНТ
        ========================================= */

        .crash-center {

            position: absolute;

            left: 50%;

            top: 67%;

            transform:
                translate(-50%,-50%);

            z-index: 15;

            text-align: center;

            pointer-events: none;
        }


        #crash-timer {

            font-size: 22px;

            font-weight: 700;

            white-space: nowrap;

            text-shadow:
                0 4px 12px
                rgba(0,0,0,.8);
        }


        #multiplier {

            font-size: 43px;

            line-height: 1;

            font-weight: 700;

            text-shadow:
                0 4px 15px
                rgba(0,0,0,.85);
        }


        #multiplier-caption {

            margin-top: 5px;

            color: #64748b;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1.4px;
        }


        #crash-msg {

            font-size: 26px;

            font-weight: 700;

            color: #ef4444;

            text-shadow:
                0 0 20px
                rgba(239,68,68,.25),
                0 4px 12px
                rgba(0,0,0,.8);
        }


        /* =========================================
           BET PANEL
        ========================================= */

        .bet-panel {

            padding: 12px;

            margin-bottom: 12px;

            border-radius: 21px;

            background:
                rgba(13,20,35,.9);

            border:
                1px solid rgba(71,85,105,.18);
        }


        .bet-label {

            color: #738197;

            font-size: 10px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: .8px;

            margin-bottom: 6px;
        }


        .bet-row {

            display: flex;

            gap: 8px;
        }


        .bet-input-wrap {

            position: relative;

            flex: 1;
        }


        .bet-input {

            width: 100%;

            height: 50px;

            padding:
                0 40px 0 14px;

            border:
                1px solid rgba(71,85,105,.3);

            border-radius: 14px;

            outline: none;

            background:
                #080e1b;

            color: white;

            font-size: 16px;

            font-weight: 700;
        }


        .bet-input:focus {

            border-color:
                rgba(59,130,246,.6);
        }


        .currency {

            position: absolute;

            right: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #64748b;

            font-size: 14px;

            font-weight: 700;
        }


        .main-button {

            flex: 1.2;

            min-height: 50px;

            border: 0;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #2563eb
                );

            color: white;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: .4px;

            box-shadow:
                0 7px 20px
                rgba(37,99,235,.25);

            transition: .12s ease;
        }


        .main-button:active:not(:disabled) {

            transform:
                translateY(2px);
        }


        .main-button:disabled {

            background:
                #273247;

            color:
                #78859a;

            box-shadow: none;
        }


        .main-button.cashout {

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            box-shadow:
                0 7px 20px
                rgba(34,197,94,.2);
        }


        /* =========================================
           PLAYERS
        ========================================= */

        .players-panel {

            padding: 12px;

            border-radius: 21px;

            background:
                rgba(13,20,35,.9);

            border:
                1px solid rgba(71,85,105,.18);
        }


        .players-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 9px;
        }


        .players-title {

            color: #d6deeb;

            font-size: 12px;

            font-weight: 700;
        }


        .players-count {

            color: #59677d;

            font-size: 9px;

            font-weight: 600;
        }


        #live-bets {

            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        .player {

            min-height: 46px;

            display: grid;

            grid-template-columns:
                minmax(0,1fr)
                auto
                auto;

            align-items: center;

            gap: 7px;

            padding: 6px 8px;

            border-radius: 12px;

            background:
                rgba(7,13,25,.7);

            border:
                1px solid rgba(51,65,85,.15);
        }


        .player.you {

            background:
                rgba(30,64,175,.18);

            border-color:
                rgba(59,130,246,.28);
        }


        .player-info {

            min-width: 0;

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .player-avatar {

            width: 30px;

            height: 30px;

            flex: 0 0 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            border-radius: 50%;

            background:
                #202b40;

            font-size: 15px;
        }


        .player-avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        .player-name {

            max-width: 105px;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            color: #d7dfec;

            font-size: 10px;

            font-weight: 600;
        }


        .player-bet {

            color: #718096;

            font-size: 9px;

            font-weight: 600;
        }


        .player-mult {

            color: #4ade80;

            font-size: 10px;

            font-weight: 700;

            text-align: right;
        }


        .player-mult.waiting {

            color: #64748b;
        }


        .player-mult.crashed {

            color: #ef4444;
        }


        /* =========================================
           MINES
        ========================================= */

        .mines-title {

            margin:
                5px 0 13px;

            text-align: center;

            font-size: 23px;

            font-weight: 700;
        }


        .mines-grid {

            display: grid;

            grid-template-columns:
                repeat(5,1fr);

            gap: 7px;

            margin-bottom: 13px;
        }


        .mine-cell {

            aspect-ratio: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 0;

            border-radius: 13px;

            background:
                linear-gradient(
                    145deg,
                    #1e293b,
                    #111827
                );

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,.025),
                0 5px 10px
                rgba(0,0,0,.18);

            cursor: pointer;

            transition: .15s ease;
        }


        .mine-cell:active {

            transform:
                scale(.94);
        }


        .mine-cell.safe {

            background:
                linear-gradient(
                    145deg,
                    #3b82f6,
                    #1d4ed8
                );

            animation:
                minePop .2s ease-out;
        }


        .mine-cell.bomb {

            background:
                linear-gradient(
                    145deg,
                    #ef4444,
                    #b91c1c
                );

            animation:
                minePop .2s ease-out;
        }


        .mine-cell img {

            width: 30px;

            height: 30px;

            object-fit: contain;
        }


        @keyframes minePop {

            from {

                transform:
                    scale(.75);
            }

            to {

                transform:
                    scale(1);
            }

        }


        .mines-panel {

            padding: 14px;

            border-radius: 21px;

            background:
                rgba(13,20,35,.9);

            border:
                1px solid rgba(71,85,105,.18);
        }


        .field-label {

            display: block;

            color: #738197;

            font-size: 10px;

            font-weight: 600;

            text-transform: uppercase;

            margin-bottom: 7px;
        }


        .number-input {

            width: 100%;

            height: 49px;

            padding:
                0 14px;

            border:
                1px solid rgba(71,85,105,.3);

            border-radius: 14px;

            outline: none;

            background:
                #080e1b;

            color: white;

            font-size: 17px;

            font-weight: 700;
        }


        .mine-settings {

            margin-top: 12px;

            padding: 13px;

            border-radius: 15px;

            background:
                rgba(7,12,23,.7);

            border:
                1px solid rgba(71,85,105,.15);
        }


        .mine-settings-top {

            display: flex;

            justify-content: space-between;

            margin-bottom: 10px;
        }


        .mine-settings-label {

            color: #8b98ab;

            font-size: 10px;

            font-weight: 600;
        }


        .mine-count {

            color: #facc15;

            font-size: 13px;

            font-weight: 700;
        }


        input[type=range] {

            width: 100%;

            height: 5px;

            appearance: none;

            -webkit-appearance: none;

            background:
                #263248;

            border-radius: 10px;

            outline: none;
        }


        input[type=range]::-webkit-slider-thumb {

            appearance: none;

            -webkit-appearance: none;

            width: 19px;

            height: 19px;

            border-radius: 50%;

            background:
                #facc15;

            box-shadow:
                0 2px 7px
                rgba(0,0,0,.5);
        }


        .mine-mult {

            margin:
                12px 0;

            text-align: center;

            color: #4ade80;

            font-size: 15px;

            font-weight: 700;
        }


        /* =========================================
           PROFILE
        ========================================= */

        .profile-page {

            padding-top: 18px;
        }


        .profile-card {

            padding: 22px 15px;

            border-radius: 23px;

            text-align: center;

            background:
                rgba(13,20,35,.9);

            border:
                1px solid rgba(71,85,105,.18);
        }


        .profile-avatar {

            width: 88px;

            height: 88px;

            margin:
                0 auto 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            border-radius: 50%;

            background:
                #202b40;

            border:
                3px solid
                rgba(59,130,246,.3);

            font-size: 37px;
        }


        .profile-avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        .profile-name {

            font-size: 22px;

            font-weight: 700;
        }


        .profile-balance {

            width: fit-content;

            margin:
                15px auto;

            padding:
                9px 20px;

            border-radius: 14px;

            background:
                rgba(7,12,23,.8);

            color: #4ade80;

            font-size: 25px;

            font-weight: 700;
        }


        .bonus-button {

            width: 100%;

            min-height: 50px;

            border: 0;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            color: white;

            font-size: 13px;

            font-weight: 700;
        }


        /* =========================================
           BOTTOM NAV
        ========================================= */

        .bottom-nav {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 100;

            padding:
                6px 7px
                calc(
                    6px +
                    env(safe-area-inset-bottom)
                );

            background:
                rgba(6,10,20,.94);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border-top:
                1px solid
                rgba(71,85,105,.18);
        }


        .nav-inner {

            max-width: 500px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(3,1fr);
        }


        .nav-button {

            border: 0;

            background: transparent;

            color: #56647b;

            padding:
                5px 4px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 2px;

            transition: .15s ease;
        }


        .nav-button.active {

            color: #60a5fa;
        }


        .nav-icon {

            width: 29px;

            height: 29px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            border-radius: 8px;
        }


        .nav-icon img {

            width: 26px;

            height: 26px;

            object-fit: contain;
        }


        .nav-label {

            font-size: 9px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: .7px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-height: 650px) {

            .crash-game {

                height: 255px;
            }

            #rocket-wrap {

                width: 120px;

                height: 120px;
            }

            #rocket {

                width: 105px;

                height: 105px;
            }

            #multiplier {

                font-size: 36px;
            }

        }

    </style>

</head>


<body>


    <!-- ФОН -->

    <div class="stars"></div>


    <!-- =========================================
         ВЕРХНЯЯ ПАНЕЛЬ
    ========================================= -->

    <header class="top-bar">

        <div class="brand">

            <div class="brand-cloud">
                ☁️
            </div>

            <div>

                <div class="brand-title">
                    TUCHA
                </div>

                <div class="brand-subtitle">
                    GAMES
                </div>

            </div>

        </div>


        <div class="balance-box">

            <span class="balance-symbol">
                $
            </span>

            <span
                id="header-balance"
                class="balance-value"
            >
                0.00
            </span>

        </div>

    </header>


    <!-- =========================================
         APP
    ========================================= -->

    <main id="app">


        <!-- =====================================
             CRASH
        ====================================== -->

        <section
            id="tab-crash"
            class="tab-content active"
        >


            <!-- ИСТОРИЯ -->

            <div
                id="crash-history"
                class="history"
            >

                <span class="history-item history-low">
                    1.45x
                </span>

                <span class="history-item history-medium">
                    2.80x
                </span>

                <span class="history-item history-low">
                    1.12x
                </span>

                <span class="history-item history-high">
                    3.41x
                </span>

            </div>


            <!-- =================================
                 ИГРОВОЕ ПОЛЕ
            ================================== -->

            <div class="crash-game">


                <div class="crash-glow"></div>


                <!--
                    ТВОЯ GIF РАКЕТЫ.

                    ВАЖНО:
                    Здесь НЕТ fallback на 🚀.

                    Поэтому используется именно
                    rocket.gif.
                -->

                <div id="rocket-wrap">

                    <img
                        src="./rocket.gif"
                        id="rocket"
                        alt="Rocket"
                    >

                </div>


                <!-- ЦЕНТР -->

                <div class="crash-center">

                    <div
                        id="crash-timer"
                    >
                        ОЖИДАНИЕ
                    </div>


                    <div
                        id="multiplier"
                        style="display:none;"
                    >
                        1.00x
                    </div>


                    <div
                        id="multiplier-caption"
                        style="display:none;"
                    >
                        коэффициент
                    </div>


                    <div
                        id="crash-msg"
                        style="display:none;"
                    >
                        КРАШ!
                    </div>

                </div>


            </div>


            <!-- =================================
                 СТАВКА
            ================================== -->

            <div class="bet-panel">

                <div class="bet-label">
                    Сумма ставки
                </div>


                <div class="bet-row">


                    <div class="bet-input-wrap">

                        <input
                            type="number"
                            id="crash-bet"
                            class="bet-input"
                            value="0.10"
                            min="0.01"
                            step="0.01"

                    >

    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /* =========================================
           TELEGRAM
        ========================================= */

        const tg =
            window.Telegram.WebApp;


        tg.expand();


        try {

            tg.setHeaderColor(
                '#070b14'
            );

            tg.setBackgroundColor(
                '#070b14'
            );

        } catch (e) {}


        /* =========================================
           USER
        ========================================= */

        let userId =
            "default_user";


        let userName =
            "Игрок";


        let userAvatarHTML =
            "👤";


        if (
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user
        ) {

            userId =
                String(
                    tg.initDataUnsafe.user.id
                );


            userName =
                tg.initDataUnsafe.user.first_name ||
                "Игрок";


            if (
                tg.initDataUnsafe.user.photo_url
            ) {

                userAvatarHTML = `

                    <img
                        src="${tg.initDataUnsafe.user.photo_url}"
                        alt=""
                    >

                `;

            }

        }


        /* =========================================
           STORAGE
        ========================================= */

        const storageKeys = {

            balance:
                `tucha_balance_${userId}`,

            bonusCount:
                `tucha_bonus_count_${userId}`

        };


        let balance = parseFloat(
            localStorage.getItem(
                storageKeys.balance
            )
        );


        if (
            isNaN(balance)
        ) {

            balance = 1.00;

        }


        let bonusCount = parseInt(
            localStorage.getItem(
                storageKeys.bonusCount
            )
        ) || 0;


        function saveStats() {

            localStorage.setItem(
                storageKeys.balance,
                balance.toFixed(2)
            );


            localStorage.setItem(
                storageKeys.bonusCount,
                bonusCount
            );

        }


        /* =========================================
           USER UI
        ========================================= */

        document.getElementById(
            'tg-name'
        ).innerText =
            userName;


        document.getElementById(
            'tg-avatar'
        ).innerHTML =
            userAvatarHTML;


        const bonusBtn =
            document.getElementById(
                'test-bonus-btn'
            );


        const bonusLeft =
            document.getElementById(
                'bonus-left'
            );


        function updateBonusButton() {

            const left =
                2 - bonusCount;


            if (
                left <= 0
            ) {

                bonusBtn.style.display =
                    'none';

            } else {

                bonusLeft.innerText =
                    left;

            }

        }


        updateBonusButton();


        /* =========================================
           BALANCE
        ========================================= */

        function updateBalanceDisplay() {

            const formatted =
                balance.toFixed(2);


            document.getElementById(
                'header-balance'
            ).innerText =
                formatted;


            document.getElementById(
                'profile-balance'
            ).innerText =
                formatted;


            saveStats();

        }


        function claimTestBonus() {

            if (
                bonusCount >= 2
            ) {

                return;

            }


            balance += 1.00;


            bonusCount++;


            updateBonusButton();

            updateBalanceDisplay();


            try {

                tg.HapticFeedback
                    .notificationOccurred(
                        'success'
                    );

            } catch (e) {}

        }


        /* =========================================
           NAVIGATION
        ========================================= */

        function switchTab(
            tabId
        ) {

            document
                .querySelectorAll(
                    '.tab-content'
                )
                .forEach(
                    element => {

                        element.classList
                            .remove(
                                'active'
                            );

                    }
                );


            document
                .getElementById(
                    'tab-' + tabId
                )
                .classList
                .add(
                    'active'
                );


            document
                .querySelectorAll(
                    '.nav-button'
                )
                .forEach(
                    button => {

                        button.classList
                            .remove(
                                'active'
                            );


                        if (
                            button.dataset.tab ===
                            tabId
                        ) {

                            button.classList
                                .add(
                                    'active'
                                );

                        }

                    }
                );


            try {

                tg.HapticFeedback
                    .impactOccurred(
                        'light'
                    );

            } catch (e) {}

        }


        /* =========================================
           CRASH
        ========================================= */

        let crashState =
            'waiting';


        let currentCrashMult =
            1.00;


        let userCrashBet =
            0;


        let userInCrash =
            false;


        let targetCrashPoint =
            1.00;


        let flyInterval =
            null;


        let playerUpdateInterval =
            null;


        let fakePlayers = [];


        const rocketWrap =
            document.getElementById(
                'rocket-wrap'
            );


        const rocketImg =
            document.getElementById(
                'rocket'
            );


        const rktTimer =
            document.getElementById(
                'crash-timer'
            );


        const rktMult =
            document.getElementById(
                'multiplier'
            );


        const rktCaption =
            document.getElementById(
                'multiplier-caption'
            );


        const rktMsg =
            document.getElementById(
                'crash-msg'
            );


        const rktBtn =
            document.getElementById(
                'btn-crash-action'
            );


        const liveBets =
            document.getElementById(
                'live-bets'
            );


        const liveBetsCount =
            document.getElementById(
                'live-bets-count'
            );


        const crashHistory =
            document.getElementById(
                'crash-history'
            );


        /* =========================================
           RANDOM PLAYERS
        ========================================= */

        const playerNames = [

            'Саня',
            'Маша',
            'Crypto',
            'Макс',
            'Даня',
            'Tucha',
            'Алекс',
            'Влад',
            'Lucky',
            'Дима',
            'Артур',
            'Nika',
            'Roman',
            'Fire',
            'Leo',
            'Миша',
            'Storm',
            'Fox'

        ];


        const playerAvatars = [

            '👤',
            '🧑',
            '👨',
            '👩',
            '😎',
            '🤠',
            '🧔',
            '👨‍💻',
            '🧑‍🚀',
            '🐱',
            '🐼',
            '🦊',
            '🐸'

        ];


        function randomName() {

            return playerNames[
                Math.floor(
                    Math.random() *
                    playerNames.length
                )
            ];

        }


        function randomAvatar() {

            return playerAvatars[
                Math.floor(
                    Math.random() *
                    playerAvatars.length
                )
            ];

        }


        function randomBet() {

            const r =
                Math.random();


            if (
                r < .55
            ) {

                return (
                    Math.random() *
                    .35 +
                    .10
                );

            }


            if (
                r < .88
            ) {

                return (
                    Math.random() *
                    .8 +
                    .25
                );

            }


            return (
                Math.random() *
                2 +
                .7
            );

        }


        function randomCashout() {

            const r =
                Math.random();


            if (
                r < .55
            ) {

                return (
                    Math.random() *
                    .55 +
                    1.10
                );

            }


            if (
                r < .88
            ) {

                return (
                    Math.random() *
                    1.4 +
                    1.25
                );

            }


            return (
                Math.random() *
                2.5 +
                1.5
            );

        }


        /* =========================================
           CREATE PLAYERS
        ========================================= */

        function createFakePlayers() {

            fakePlayers = [];


            const amount =
                Math.floor(
                    Math.random() * 3
                ) + 4;


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                fakePlayers.push({

                    name:
                        randomName(),

                    avatar:
                        randomAvatar(),

                    bet:
                        randomBet(),

                    cashoutAt:
                        randomCashout(),

                    currentMult:
                        1.00,

                    status:
                        'waiting',

                    win:
                        0

                });

            }

        }


        /* =========================================
           RENDER PLAYERS
        ========================================= */

        function renderPlayers() {

            liveBets.innerHTML =
                '';


            if (
                userInCrash
            ) {

                liveBets.insertAdjacentHTML(
                    'beforeend',
                    `

                    <div class="player you">

                        <div class="player-info">

                            <div class="player-avatar">
                                ${userAvatarHTML}
                            </div>

                            <div>

                                <div class="player-name">
                                    ${escapeHTML(userName)}
                                </div>

                                <div class="player-bet">
                                    $${userCrashBet.toFixed(2)}
                                </div>

                            </div>

                        </div>


                        <div
                            id="user-player-mult"
                            class="player-mult waiting"
                        >
                            1.00x
                        </div>


                        <div
                            id="user-player-win"
                            class="player-bet"
                        >
                            —
                        </div>

                    </div>

                    `
                );

            }


            fakePlayers.forEach(
                (player, index) => {


                    let multText =
                        '1.00x';


                    let multClass =
                        'waiting';


                    let winText =
                        '';


                    if (
                        player.status ===
                        'active'
                    ) {

                        multText =
                            currentCrashMult
                                .toFixed(2) +
                            'x';

                        multClass =
                            '';

                    }


                    if (
                        player.status ===
                        'cashed'
                    ) {

                        multText =
                            player.cashoutAt
                                .toFixed(2) +
                            'x';

                        multClass =
                            '';

                        winText =
                            '$' +
                            player.win
                                .toFixed(2);

                    }


                    if (
                        player.status ===
                        'crashed'
                    ) {

                        multText =
                            'КРАШ';

                        multClass =
                            'crashed';

                    }


                    liveBets.insertAdjacentHTML(
                        'beforeend',
                        `

                        <div class="player">

                            <div class="player-info">

                                <div class="player-avatar">
                                    ${player.avatar}
                                </div>

                                <div>

                                    <div class="player-name">
                                        ${escapeHTML(player.name)}
                                    </div>

                                    <div class="player-bet">
                                        $${player.bet.toFixed(2)}
                                    </div>

                                </div>

                            </div>


                            <div
                                id="fake-mult-${index}"
                                class="player-mult ${multClass}"
                            >
                                ${multText}
                            </div>


                            <div
                                id="fake-win-${index}"
                                class="player-bet"
                            >
                                ${winText}
                            </div>

                        </div>

                        `
                    );

                }
            );


            liveBetsCount.innerText =

                (
                    fakePlayers.length +
                    (
                        userInCrash
                            ? 1
                            : 0
                    )
                ) +

                ' ставок';

        }


        function escapeHTML(
            text
        ) {

            const div =
                document.createElement(
                    'div'
                );


            div.innerText =
                text;


            return div.innerHTML;

        }


        /* =========================================
           UPDATE PLAYERS
        ========================================= */

        function updatePlayers() {

            fakePlayers.forEach(
                (player, index) => {


                    if (
                        player.status ===
                        'waiting'
                    ) {

                        player.status =
                            'active';

                    }


                    if (
                        player.status ===
                        'active'
                    ) {

                        player.currentMult =
                            currentCrashMult;


                        if (
                            currentCrashMult >=
                            player.cashoutAt
                        ) {

                            player.status =
                                'cashed';


                            player.win =
                                player.bet *
                                player.cashoutAt;

                        }

                    }


                    const mult =
                        document.getElementById(
                            'fake-mult-' +
                            index
                        );


                    const win =
                        document.getElementById(
                            'fake-win-' +
                            index
                        );


                    if (
                        !mult
                    ) {

                        return;

                    }


                    if (
                        player.status ===
                        'active'
                    ) {

                        mult.innerText =
                            currentCrashMult
                                .toFixed(2) +
                            'x';


                        mult.className =
                            'player-mult';

                    }


                    else if (
                        player.status ===
                        'cashed'
                    ) {

                        mult.innerText =
                            player.cashoutAt
                                .toFixed(2) +
                            'x';


                        mult.className =
                            'player-mult';


                        if (win) {

                            win.innerText =
                                '$' +
                                player.win
                                    .toFixed(2);

                        }

                    }


                    else if (
                        player.status ===
                        'crashed'
                    ) {

                        mult.innerText =
                            'КРАШ';


                        mult.className =
                            'player-mult crashed';

                    }

                }
            );


            if (
                userInCrash
            ) {

                const userMult =
                    document.getElementById(
                        'user-player-mult'
                    );


                const userWin =
                    document.getElementById(
                        'user-player-win'
                    );


                if (
                    userMult
                ) {

                    userMult.innerText =
                        currentCrashMult
                            .toFixed(2) +
                        'x';


                    userMult.className =
                        'player-mult';

                }


                if (
                    userWin
                ) {

                    userWin.innerText =
                        '$' +
                        (
                            userCrashBet *
                            currentCrashMult
                        ).toFixed(2);

                }

            }

        }


        /* =========================================
           HISTORY
        ========================================= */

        function addCrashHistory(
            mult
        ) {

            const item =
                document.createElement(
                    'span'
                );


            item.className =
                'history-item';


            if (
                mult < 1.5
            ) {

                item.classList.add(
                    'history-low'
                );

            }

            else if (
                mult < 3
            ) {

                item.classList.add(
                    'history-medium'
                );

            }

            else {

                item.classList.add(
                    'history-high'
                );

            }


            item.innerText =
                mult.toFixed(2) +
                'x';


            crashHistory.prepend(
                item
            );


            while (
                crashHistory.children.length >
                9
            ) {

                crashHistory.lastElementChild
                    .remove();

            }

        }


        /* =========================================
           INITIAL HISTORY
        ========================================= */

        function createInitialHistory() {

            const values = [

                1.44,
                1.00,
                2.18,
                1.29,
                1.67,
                3.12,
                1.13,
                2.44,
                1.78

            ];


            values.forEach(
                value => {

                    addCrashHistory(
                        value
                    );

                }
            );

        }


        /* =========================================
           CRASH START
        ========================================= */

        function startCrashLoop() {

            clearInterval(
                flyInterval
            );


            clearInterval(
                playerUpdateInterval
            );


            crashState =
                'waiting';


            userInCrash =
                false;


            userCrashBet =
                0;


            currentCrashMult =
                1.00;


            createFakePlayers();


            renderPlayers();


            /*
                РАКЕТА НЕ СКРЫВАЕТСЯ.

                Она сразу существует
                в игровом поле.
            */

            rocketWrap.style.display =
                'flex';


            rocketImg.className =
                'flying';


            rktTimer.style.display =
                'block';


            rktMult.style.display =
                'none';


            rktCaption.style.display =
                'none';


            rktMsg.style.display =
                'none';


            rktBtn.disabled =
                false;


            rktBtn.innerText =
                'СДЕЛАТЬ СТАВКУ';


            rktBtn.className =
                'main-button';


            let timer = 5;


            rktTimer.innerText =
                'СТАРТ ЧЕРЕЗ ' +
                timer;


            playerUpdateInterval =
                setInterval(
                    () => {

                        renderPlayers();

                    },
                    1200
                );


            const countInterval =
                setInterval(
                    () => {

                        timer--;


                        if (
                            timer > 0
                        ) {

                            rktTimer.innerText =
                                'СТАРТ ЧЕРЕЗ ' +
                                timer;

                        }


                        if (
                            timer <= 0
                        ) {

                            clearInterval(
                                countInterval
                            );


                            flyCrash();

                        }

                    },
                    1000
                );

        }


        /* =========================================
           FLY
        ========================================= */

        function flyCrash() {

            clearInterval(
                playerUpdateInterval
            );


            crashState =
                'flying';


            rktTimer.style.display =
                'none';


            rocketWrap.style.display =
                'flex';


            rocketImg.className =
                'flying';


            rktMult.style.display =
                'block';


            rktCaption.style.display =
                'block';


            rktMsg.style.display =
                'none';


            currentCrashMult =
                1.00;


            targetCrashPoint =
                parseFloat(
                    (
                        Math.random() *
                        3.8 +
                        1.20
                    ).toFixed(2)
                );


            /*
                Редкие высокие раунды.
            */

            if (
                Math.random() < .07
            ) {

                targetCrashPoint =
                    parseFloat(
                        (
                            Math.random() *
                            7 +
                            5
                        ).toFixed(2)
                    );

            }


            fakePlayers.forEach(
                player => {

                    player.status =
                        'active';

                    player.currentMult =
                        1.00;

                }
            );


            renderPlayers();


            if (
                userInCrash
            ) {

                rktBtn.disabled =
                    false;


                rktBtn.innerText =
                    'ЗАБРАТЬ $' +
                    (
                        userCrashBet *
                        currentCrashMult
                    ).toFixed(2);


                rktBtn.className =
                    'main-button cashout';

            }

            else {

                rktBtn.disabled =
                    true;


                rktBtn.innerText =
                    'ПОЛЁТ...';


                rktBtn.className =
                    'main-button';

            }


            flyInterval =
                setInterval(
                    () => {


                        currentCrashMult +=
                            .01;


                        rktMult.innerText =
                            currentCrashMult
                                .toFixed(2) +
                            'x';


                        updatePlayers();


                        if (
                            userInCrash
                        ) {

                            rktBtn.innerText =
                                'ЗАБРАТЬ $' +
                                (
                                    userCrashBet *
                                    currentCrashMult
                                ).toFixed(2);

                        }


                        if (
                            currentCrashMult >=
                            targetCrashPoint
                        ) {

                            clearInterval(
                                flyInterval
                            );


                            doCrash();

                        }

                    },
                    60
                );

        }


        /* =========================================
           CRASH
        ========================================= */

        function doCrash() {

            clearInterval(
                flyInterval
            );


            crashState =
                'crashed';


            fakePlayers.forEach(
                player => {

                    if (
                        player.status ===
                        'active'
                    ) {

                        player.status =
                            'crashed';

                    }

                }
            );


            updatePlayers();


            /*
                Здесь GIF больше не двигается
                и визуально падает.
            */

            rocketImg.className =
                'crashed';


            rktMult.style.display =
                'none';


            rktCaption.style.display =
                'none';


            rktMsg.style.display =
                'block';


            rktMsg.innerText =
                'КРАШ ' +
                targetCrashPoint.toFixed(2) +
                'x';


            addCrashHistory(
                targetCrashPoint
            );


            try {

                tg.HapticFeedback
                    .notificationOccurred(
                        'error'
                    );

            } catch (e) {}


            if (
                userInCrash
            ) {

                userInCrash =
                    false;

                userCrashBet =
                    0;

            }


            rktBtn.disabled =
                true;


            rktBtn.className =
                'main-button';


            rktBtn.innerText =
                'ПРОИГРЫШ';


            setTimeout(
                () => {

                    startCrashLoop();

                },
                3000
            );

        }


        /* =========================================
           CRASH BUTTON
        ========================================= */

        function handleCrashAction() {


            /*
                СДЕЛАТЬ СТАВКУ
            */

            if (
                crashState ===
                'waiting'
            ) {

                const bet =
                    parseFloat(
                        document.getElementById(
                            'crash-bet'
                        ).value
                    );


                if (
                    bet <= 0 ||
                    isNaN(bet) ||
                    bet > balance
                ) {

                    try {

                        tg.HapticFeedback
                            .notificationOccurred(
                                'error'
                            );

                    } catch (e) {}


                    alert(
                        'Недостаточно средств или неверная ставка!'
                    );


                    return;

                }


                balance -=
                    bet;


                userCrashBet =
                    bet;


                userInCrash =
                    true;


                updateBalanceDisplay();


                renderPlayers();


                rktBtn.disabled =
                    true;


                rktBtn.innerText =
                    'СТАВКА ПРИНЯТА';


                try {

                    tg.HapticFeedback
                        .impactOccurred(
                            'medium'
                        );

                } catch (e) {}


                return;

            }


            /*
                ЗАБРАТЬ ВЫИГРЫШ
            */

            if (
                crashState ===
                'flying' &&
                userInCrash
            ) {

                const win =
                    userCrashBet *
                    currentCrashMult;


                balance +=
                    win;


                userInCrash =
                    false;


                updateBalanceDisplay();


                rktBtn.disabled =
                    true;


                rktBtn.innerText =
                    'ВЫИГРАНО $' +
                    win.toFixed(2);


                rktBtn.className =
                    'main-button';


                try {

                    tg.HapticFeedback
                        .notificationOccurred(
                            'success'
                        );

                } catch (e) {}

            }

        }


        /* =========================================
           MINES
        ========================================= */

        let minesGameState =
            'idle';


        let minesPositions =
            [];


        let currentMineBet =
            0;


        let currentMineMult =
            1.00;


        let safeClicksCount =
            0;


        let totalBombs =
            3;


        const minesGrid =
            document.getElementById(
                'mines-grid'
            );


        const minesButton =
            document.getElementById(
                'btn-mines-action'
            );


        const minesMultDisplay =
            document.getElementById(
                'mines-multiplier-display'
            );


        const minesMultValue =
            document.getElementById(
                'current-mine-mult'
            );


        /* =========================================
           MINES GRID
        ========================================= */

        function buildMinesGrid() {

            minesGrid.innerHTML =
                '';


            for (
                let i = 0;
                i < 25;
                i++
            ) {

                const cell =
                    document.createElement(
                        'div'
                    );


                cell.className =
                    'mine-cell';


                cell.dataset.index =
                    i;


                minesGrid.appendChild(
                    cell
                );

            }

        }


        buildMinesGrid();


        /* =========================================
           MINES ACTION
        ========================================= */

        function handleMinesAction() {


            /*
                НАЧАЛО
            */

            if (
                minesGameState ===
                'idle'
            ) {

                const bet =
                    parseFloat(
                        document.getElementById(
                            'mines-bet'
                        ).value
                    );


                if (
                    bet <= 0 ||
                    isNaN(bet) ||
                    bet > balance
                ) {

                    try {

                        tg.HapticFeedback
                            .notificationOccurred(
                                'error'
                            );

                    } catch (e) {}


                    alert(
                        'Недостаточно средств или неверная ставка!'
                    );


                    return;

                }


                buildMinesGrid();


                balance -=
                    bet;


                updateBalanceDisplay();


                totalBombs =
                    parseInt(
                        document.getElementById(
                            'mines-slider'
                        ).value
                    );


                currentMineBet =
                    bet;


                currentMineMult =
                    1.00;


                safeClicksCount =
                    0;


                minesGameState =
                    'playing';


                minesPositions =
                    [];


                while (
                    minesPositions.length <
                    totalBombs
                ) {

                    const random =
                        Math.floor(
                            Math.random() *
                            25
                        );


                    if (
                        !minesPositions
                            .includes(
                                random
                            )
                    ) {

                        minesPositions.push(
                            random
                        );

                    }

                }


                minesMultDisplay.style.display =
                    'block';


                minesMultValue.innerText =
                    '1.00';


                minesButton.innerText =
                    'ВЫБЕРИТЕ ЯЧЕЙКУ';


                minesButton.disabled =
                    true;


                minesButton.className =
                    'main-button';


                document
                    .querySelectorAll(
                        '.mine-cell'
                    )
                    .forEach(
                        cell => {

                            cell.onclick =
                                () => {

                                    clickMine(
                                        parseInt(
                                            cell.dataset.index
                                        ),
                                        cell
                                    );

                                };

                        }
                    );


                return;

            }


            /*
                CASH OUT
            */

            if (
                minesGameState ===
                'playing'
            ) {

                const win =
                    currentMineBet *
                    currentMineMult;


                balance +=
                    win;


                updateBalanceDisplay();


                try {

                    tg.HapticFeedback
                        .notificationOccurred(
                            'success'
                        );

                } catch (e) {}


                endMinesGame(
                    'ВЫИГРЫШ $' +
                    win.toFixed(2)
                );

            }

        }


        /* =========================================
           CLICK MINE
        ========================================= */

        function clickMine(
            index,
            cell
        ) {

            if (
                minesGameState !==
                'playing'
            ) {

                return;

            }


            cell.onclick =
                null;


            /*
                БОМБА
            */

            if (
                minesPositions.includes(
                    index
                )
            ) {

                cell.classList.add(
                    'bomb'
                );


                cell.innerHTML = `

                    <img
                        src="./bomb.png"
                        alt="Bomb"
                    >

                `;


                try {

                    tg.HapticFeedback
                        .notificationOccurred(
                            'error'
                        );

                } catch (e) {}


                document
                    .querySelectorAll(
                        '.mine-cell'
                    )
                    .forEach(
                        (otherCell, i) => {

                            otherCell.onclick =
                                null;


                            if (
                                minesPositions
                                    .includes(i) &&
                                i !== index
                            ) {

                                otherCell
                                    .classList
                                    .add(
                                        'bomb'
                                    );


                                otherCell.innerHTML = `

                                    <img
                                        src="./bomb.png"
                                        alt="Bomb"
                                        style="opacity:.5"
                                    >

                                `;

                            }

                        }
                    );


                endMinesGame(
                    'ПРОИГРЫШ'
                );


                return;

            }


            /*
                БЕЗОПАСНАЯ КЛЕТКА
            */

            cell.classList.add(
                'safe'
            );


            cell.innerHTML = `

                <img
                    src="./star.png"
                    alt="Safe"
                >

            `;


            try {

                tg.HapticFeedback
                    .impactOccurred(
                        'medium'
                    );

            } catch (e) {}


            safeClicksCount++;


            let probability =
                1.0;


            for (
                let i = 0;
                i < safeClicksCount;
                i++
            ) {

                probability *=

                    (
                        25 -
                        totalBombs -
                        i
                    )

                    /

                    (
                        25 -
                        i
                    );

            }


            const houseEdge =
                .95;


            currentMineMult =
                houseEdge /
                probability;


            minesMultValue.innerText =
                currentMineMult
                    .toFixed(2);


            const currentWin =
                currentMineBet *
                currentMineMult;


            minesButton.disabled =
                false;


            minesButton.innerText =
                'ЗАБРАТЬ $' +
                currentWin.toFixed(2);


            minesButton.className =
                'main-button cashout';


            if (
                safeClicksCount ===
                (
                    25 -
                    totalBombs
                )
            ) {

                balance +=
                    currentWin;


                updateBalanceDisplay();


                endMinesGame(
                    'СУПЕР ВЫИГРЫШ $' +
                    currentWin.toFixed(2)
                );

            }

        }


        /* =========================================
           END MINES
        ========================================= */

        function endMinesGame(
            message
        ) {

            minesGameState =
                'idle';


            minesButton.disabled =
                false;


            minesButton.innerText =
                message;


            minesButton.className =
                'main-button';


            setTimeout(
                () => {

                    if (
                        minesGameState ===
                        'idle'
                    ) {

                        minesMultDisplay
                            .style
                            .display =
                            'none';


                        minesButton.innerText =
                            'ИГРАТЬ';


                        minesButton.className =
                            'main-button';

                    }

                },
                3000
            );

        }


        /* =========================================
           START
        ========================================= */

        updateBalanceDisplay();


        createInitialHistory();


        buildMinesGrid();


        startCrashLoop();


    </script>

<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Tucha Games</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        body {

            margin: 0;

            background-color: #0f172a;

            color: white;

            user-select: none;

            font-family: 'Fredoka', sans-serif;

            overflow: hidden;
        }


        .bg-space {

            background:
                radial-gradient(
                    circle at top,
                    #1e3a8a 0%,
                    #0f172a 80%
                );

            position: relative;

            overflow: hidden;
        }


        .stars {

            position: absolute;

            inset: 0;

            background:
                transparent
                url('https://www.transparenttextures.com/patterns/stardust.png')
                repeat;

            opacity: 0.4;

            pointer-events: none;
        }


        .tab-content {

            display: none;

            padding-bottom: 90px;
        }


        .tab-content.active {

            display: block;
        }


        /* =========================================
           РАКЕТКА
        ========================================= */

        .rocket-container {

            height: 260px;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

            overflow: hidden;
        }


        #rocket-wrap {

            position: absolute;

            left: 50%;

            top: 43%;

            width: 130px;

            height: 130px;

            transform:
                translate(-50%, -50%);

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 5;
        }


        .rocket-img {

            display: block;

            width: 115px;

            height: 115px;

            object-fit: contain;

            object-position: center;

            margin: 0;

            filter:
                drop-shadow(
                    0 0 15px
                    rgba(56,189,248,.65)
                )
                drop-shadow(
                    0 10px 15px
                    rgba(0,0,0,.55)
                );

            z-index: 10;
        }


        .rocket-img.flying {

            animation:
                fly .4s infinite alternate;
        }


        @keyframes fly {

            from {

                transform:
                    translateY(2px)
                    rotate(3deg);
            }


            to {

                transform:
                    translateY(-9px)
                    rotate(8deg);
            }

        }


        .rocket-img.crashed {

            filter:
                grayscale(100%)
                opacity(.7);

            transform:
                rotate(160deg)
                translateY(15px) !important;

            animation: none;
        }


        /* =========================================
           МИНЫ
        ========================================= */

        .mine-cell {

            aspect-ratio: 1;

            background:
                linear-gradient(
                    145deg,
                    #1e293b,
                    #172033
                );

            border-radius: 12px;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;

            transition:
                .15s ease;

            border-bottom:
                4px solid #0f172a;

            font-size: 2rem;

            overflow: hidden;
        }


        .mine-cell:active {

            transform:
                translateY(4px);

            border-bottom-width: 0;

        }


        .mine-cell.safe {

            background:
                linear-gradient(
                    145deg,
                    #3b82f6,
                    #1d4ed8
                );

            border-bottom-color:
                #1d4ed8;

            animation:
                pop .25s ease-out;
        }


        .mine-cell.bomb {

            background:
                linear-gradient(
                    145deg,
                    #ef4444,
                    #b91c1c
                );

            border-bottom-color:
                #b91c1c;

            animation:
                pop .25s ease-out;
        }


        .mine-cell img {

            width: 38px;

            height: 38px;

            object-fit: contain;

            pointer-events: none;
        }


        @keyframes pop {

            0% {

                transform:
                    scale(.7);
            }


            100% {

                transform:
                    scale(1);
            }

        }


        /* =========================================
           КНОПКИ
        ========================================= */

        .btn-tucha {

            border: none;

            border-bottom:
                5px solid
                rgba(0,0,0,.3);

            transition:
                all .1s;
        }


        .btn-tucha:active:not(:disabled) {

            transform:
                translateY(5px);

            border-bottom: 0;

            margin-top: 5px;
        }


        .btn-tucha:disabled {

            opacity: .7;

            transform: none;

            border-bottom:
                5px solid
                rgba(0,0,0,.3);

            margin-top: 0;

            cursor: not-allowed;
        }


        /* =========================================
           SLIDER
        ========================================= */

        input[type=range] {

            -webkit-appearance: none;

            appearance: none;

            background: transparent;
        }


        input[type=range]::-webkit-slider-thumb {

            -webkit-appearance: none;

            appearance: none;

            height: 24px;

            width: 24px;

            border-radius: 50%;

            background: #facc15;

            cursor: pointer;

            margin-top: -8px;

            box-shadow:
                0 2px 5px
                rgba(0,0,0,.5);
        }


        input[type=range]::-webkit-slider-runnable-track {

            width: 100%;

            height: 8px;

            background: #334155;

            border-radius: 4px;
        }


        /* =========================================
           PLAYERS
        ========================================= */

        .player-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 10px;

            background:
                rgba(15,23,42,.6);

            border-radius: 12px;

            border:
                1px solid
                rgba(71,85,105,.25);
        }


        .player-row.you {

            background:
                rgba(30,64,175,.45);

            border-color:
                rgba(59,130,246,.55);
        }


        /* =========================================
           ОШИБКА / КРАШ
        ========================================= */

        #crash-msg {

            pointer-events: none;
        }


    </style>

</head>

    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /* =========================================
           TELEGRAM
        ========================================= */

        const tg =
            window.Telegram.WebApp;


        tg.expand();


        try {

            tg.setHeaderColor(
                '#0f172a'
            );

            tg.setBackgroundColor(
                '#0f172a'
            );

        } catch (e) {}


        /* =========================================
           USER
        ========================================= */

        let userId =
            "default_user";


        let userName =
            "Игрок";


        let userAvatarHTML =
            "👤";


        if (
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user
        ) {

            userId =
                String(
                    tg.initDataUnsafe.user.id
                );


            userName =
                tg.initDataUnsafe.user.first_name ||
                "Игрок";


            if (
                tg.initDataUnsafe.user.photo_url
            ) {

                userAvatarHTML = `

                    <img
                        src="${tg.initDataUnsafe.user.photo_url}"
                        class="w-full h-full object-cover"
                        alt=""
                    >

                `;

            }

        }


        /* =========================================
           STORAGE
        ========================================= */

        const storageKeys = {

            balance:
                `tucha_balance_${userId}`,

            bonusCount:
                `tucha_bonus_count_${userId}`

        };


        let balance =
            parseFloat(
                localStorage.getItem(
                    storageKeys.balance
                )
            );


        if (
            isNaN(balance)
        ) {

            balance =
                1.00;

        }


        let bonusCount =
            parseInt(
                localStorage.getItem(
                    storageKeys.bonusCount
                )
            ) || 0;


        function saveStats() {

            localStorage.setItem(
                storageKeys.balance,
                balance.toFixed(2)
            );


            localStorage.setItem(
                storageKeys.bonusCount,
                bonusCount
            );

        }


        /* =========================================
           PROFILE
        ========================================= */

        document.getElementById(
            'tg-name'
        ).innerText =
            userName;


        document.getElementById(
            'tg-avatar'
        ).innerHTML =
            userAvatarHTML;


        const bonusBtn =
            document.getElementById(
                'test-bonus-btn'
            );


        const bonusLeftSpan =
            document.getElementById(
                'bonus-left'
            );


        function updateBonusButton() {

            const left =
                2 - bonusCount;


            if (
                left <= 0
            ) {

                bonusBtn.style.display =
                    'none';

            } else {

                bonusLeftSpan.innerText =
                    left;

            }

        }


        updateBonusButton();


        function updateBalanceDisplay() {

            const formatted =
                balance.toFixed(2);


            document.getElementById(
                'header-balance'
            ).innerText =
                formatted;


            document.getElementById(
                'profile-balance'
            ).innerText =
                formatted;


            saveStats();

        }


        function claimTestBonus() {

            if (

        /* =========================================

        ========================================= */

        function addCrashHistory(
            mult
        ) {

            const span =
                document.createElement(
                    'span'
                );


            let colorClass =
                'text-blue-400';


            if (
                mult >= 3
            ) {

                colorClass =
                    'text-green-400';

            } else if (
                mult >= 2
            ) {

                colorClass =
                    'text-purple-400';

            }


            span.className = `

                bg-slate-800/50

                px-3

                py-1

                rounded-full

                text-xs

                font-bold

                ${colorClass}

                border

                border-slate-700

            `;


            span.innerText =
                mult.toFixed(2) +
                'x';


            crashHistoryContainer.prepend(
                span
            );


            while (
                crashHistoryContainer.children.length >
                7
            ) {

                crashHistoryContainer
                    .lastElementChild
                    .remove();

            }

        }

            if (

                rktBtn.className = `

                    bg-green-600

                    text-white

                    font-extrabold

                    py-4

                    rounded-2xl

                    text-xl

                    tracking-wide

                `;

                        );

        /* =========================================
           МИНЫ
        ========================================= */

        let minesGameState =
            'idle';


        /*
            Возможные состояния:

            idle
            playing
            finished

            ВАЖНО:
            finished НЕ запускает новую игру.

            Новый раунд начинается только
            по нажатию "ИГРАТЬ СНОВА".
        */


        let minesPositions =
            [];


        let currentMineBet =
            0;


        let currentMineMult =
            1.00;


        let safeClicksCount =
            0;


        let totalBombs =
            3;


        const mGrid =
            document.getElementById(
                'mines-grid'
            );


        const mBtn =
            document.getElementById(
                'btn-mines-action'
            );


        const mMultDisp =
            document.getElementById(
                'mines-multiplier-display'
            );


        const mMultVal =
            document.getElementById(
                'current-mine-mult'
            );


        /* =========================================
           СОЗДАТЬ ЧИСТОЕ ПОЛЕ
        ========================================= */

        function buildMinesGrid() {

            mGrid.innerHTML =
                '';


            for (
                let i = 0;
                i < 25;
                i++
            ) {

                const cell =
                    document.createElement(
                        'div'
                    );


                cell.className =
                    'mine-cell';


                cell.dataset.index =
                    i;


                cell.innerHTML =
                    '';


                mGrid.appendChild(
                    cell
                );

            }

        }


        buildMinesGrid();


        /* =========================================
           НАЧАТЬ НОВУЮ ИГРУ
        ========================================= */

        function startNewMinesGame() {

            const bet =
                parseFloat(
                    document.getElementById(
                        'mines-bet'
                    ).value
                );


            if (
                bet > balance ||
                bet <= 0 ||
                isNaN(bet)
            ) {

                try {

                    tg.HapticFeedback
                        .notificationOccurred(
                            'error'
                        );

                } catch (e) {}


                alert(
                    'Недостаточно средств или неверная ставка!'
                );


                return;

            }


            /*
                Только здесь создаём
                НОВОЕ случайное поле.
            */

            buildMinesGrid();


            balance -=
                bet;


            updateBalanceDisplay();


            totalBombs =
                parseInt(
                    document.getElementById(
                        'mines-slider'
                    ).value
                );


            currentMineBet =
                bet;


            currentMineMult =
                1.00;


            safeClicksCount =
                0;


            minesGameState =
                'playing';


            minesPositions =
                [];


            while (
                minesPositions.length <
                totalBombs
            ) {

                const random =
                    Math.floor(
                        Math.random() *
                        25
                    );


                if (
                    !minesPositions
                        .includes(
                            random
                        )
                ) {

                    minesPositions.push(
                        random
                    );

                }

            }


            mMultDisp.style.display =
                'block';


            mMultVal.innerText =
                '1.00';


            /*
                Пока игра идёт —
                кнопка заблокирована,
                пока игрок не откроет
                хотя бы одну безопасную.
            */

            mBtn.innerText =
                'ВЫБЕРИТЕ ЯЧЕЙКУ';


            mBtn.disabled =
                true;


            mBtn.className = `

                btn-tucha

                w-full

                bg-slate-600

                text-white

                font-extrabold

                py-4

                rounded-2xl

                text-xl

                uppercase

                tracking-wide

            `;


            /*
                Отключаем изменение количества
                бомб во время игры.
            */

            document.getElementById(
                'mines-slider'
            ).disabled =
                true;


            const cells =
                document.querySelectorAll(
                    '.mine-cell'
                );


            cells.forEach(
                cell => {

                    cell.onclick =
                        () => {

                            clickMine(
                                parseInt(
                                    cell.dataset.index
                                ),
                                cell
                            );

                        };

                }
            );


            try {

                tg.HapticFeedback
                    .impactOccurred(
                        'medium'
                    );

            } catch (e) {}

        }


        /* =========================================
           ОСНОВНАЯ КНОПКА МИН
        ========================================= */

        function handleMinesAction() {


            /*
                IDLE

                Значит игра ещё не началась.
                Начинаем новый раунд.
            */

            if (
                minesGameState ===
                'idle'
            ) {

                startNewMinesGame();

                return;

            }


            /*
                PLAYING

                Значит игрок нажал
                "ЗАБРАТЬ".
            */

            if (
                minesGameState ===
                'playing'
            ) {

                const win =
                    currentMineBet *
                    currentMineMult;


                balance +=
                    win;


                updateBalanceDisplay();


                try {

                    tg.HapticFeedback
                        .notificationOccurred(
                            'success'
                        );

                } catch (e) {}


                /*
                    НЕ запускаем новую игру.

                    Поле остаётся.
                */

                endMinesGame(
                    `ВЫИГРЫШ $${win.toFixed(2)}`,
                    'green'
                );


                return;

            }


            /*
                FINISHED

                Игрок нажал
                "ИГРАТЬ СНОВА".

                Только сейчас
                создаётся новое поле.
            */

            if (
                minesGameState ===
                'finished'
            ) {

                startNewMinesGame();

                return;

            }

        }


        /* =========================================
           КЛИК ПО ЯЧЕЙКЕ
        ========================================= */

        function clickMine(
            index,
            cellEl
        ) {

            if (
                minesGameState !==
                'playing'
            ) {

                return;

            }


            /*
                Нельзя нажать повторно.
            */

            cellEl.onclick =
                null;


            /* =====================================
               БОМБА
            ==================================== */

            if (
                minesPositions.includes(
                    index
                )
            ) {

                cellEl.classList.add(
                    'bomb'
                );


                cellEl.innerHTML = `

                    <img
                        src="./bomb.png"
                        class="
                            w-9
                            h-9
                            object-contain
                        "
                        alt="Bomb"
                    >

                `;


                /*
                    После попадания на мину
                    показываем ВСЕ остальные мины.
                */

                document
                    .querySelectorAll(
                        '.mine-cell'
                    )
                    .forEach(
                        (otherCell, i) => {

                            otherCell.onclick =
                                null;


                            if (
                                minesPositions
                                    .includes(i)
                            ) {

                                if (
                                    i !== index
                                ) {

                                    otherCell
                                        .classList
                                        .add(
                                            'bomb'
                                        );


                                    otherCell.innerHTML = `

                                        <img
                                            src="./bomb.png"
                                            class="
                                                w-9
                                                h-9
                                                object-contain
                                            "
                                            alt="Bomb"
                                        >

                                    `;

                                }

                            }

                        }
                    );


                try {

                    tg.HapticFeedback
                        .notificationOccurred(
                            'error'
                        );

                } catch (e) {}


                /*
                    НЕ СБРАСЫВАЕМ ПОЛЕ.
                */

                endMinesGame(
                    'ПРОИГРЫШ',
                    'red'
                );


                return;

            }


            /* =====================================
               БЕЗОПАСНАЯ ЯЧЕЙКА
            ==================================== */

            cellEl.classList.add(
                'safe'
            );


            cellEl.innerHTML = `

                <img
                    src="./star.png"
                    class="
                        w-9
                        h-9
                        object-contain
                    "
                    alt="Safe"
                >

            `;


            try {

                tg.HapticFeedback
                    .impactOccurred(
                        'medium'
                    );

            } catch (e) {}


            safeClicksCount++;


            /*
                Расчёт коэффициента.
            */

            let probability =
                1.0;


            for (
                let i = 0;
                i < safeClicksCount;
                i++
            ) {

                probability *=

                    (
                        25 -
                        totalBombs -
                        i
                    )

                    /

                    (
                        25 -
                        i
                    );

            }


            const houseEdge =
                0.95;


            currentMineMult =
                houseEdge /
                probability;


            mMultVal.innerText =
                currentMineMult
                    .toFixed(2);


            const currentWin =
                currentMineBet *
                currentMineMult;


            /*
                Теперь можно забрать.
            */

            mBtn.disabled =
                false;


            mBtn.innerText =
                `ЗАБРАТЬ $${currentWin.toFixed(2)}`;


            mBtn.className = `

                btn-tucha

                w-full

                bg-green-500

                text-white

                font-extrabold

                py-4

                rounded-2xl

                text-xl

                uppercase

                tracking-wide

            `;


            /*
                Открыты все безопасные клетки.

                Автоматически выигрываем,
                но НОВАЯ игра не запускается.
            */

            if (
                safeClicksCount ===
                (
                    25 -
                    totalBombs
                )
            ) {

                balance +=
                    currentWin;


                updateBalanceDisplay();


                endMinesGame(
                    `СУПЕР ВЫИГРЫШ $${currentWin.toFixed(2)}`,
                    'yellow'
                );

            }

        }


        /* =========================================
           ЗАВЕРШЕНИЕ МИН
        ========================================= */

        function endMinesGame(
            message,
            color
        ) {

            /*
                ВАЖНО:

                Больше НИКАКИХ setTimeout.

                Игра остаётся законченной.
            */

            minesGameState =
                'finished';


            /*
                Отключаем все клетки.
            */

            document
                .querySelectorAll(
                    '.mine-cell'
                )
                .forEach(
                    cell => {

                        cell.onclick =
                            null;

                    }
                );


            /*
                Разрешаем снова менять
                количество бомб.
            */

            document.getElementById(
                'mines-slider'
            ).disabled =
                false;


            /*
                Показываем финальный
                результат.
            */

            mBtn.disabled =
                false;


            if (
                color ===
                'red'
            ) {

                mBtn.className = `

                    btn-tucha

                    w-full

                    bg-red-500

                    text-white

                    font-extrabold

                    py-4

                    rounded-2xl

                    text-xl

                    uppercase

                    tracking-wide

                `;

            }

            else if (
                color ===
                'green'
            ) {

                mBtn.className = `

                    btn-tucha

                    w-full

                    bg-green-500

                    text-white

                    font-extrabold

                    py-4

                    rounded-2xl

                    text-xl

                    uppercase

                    tracking-wide

                `;

            }

            else {

                mBtn.className = `

                    btn-tucha

                    w-full

                    bg-yellow-500

                    text-white

                    font-extrabold

                    py-4

                    rounded-2xl

                    text-xl

                    uppercase

                    tracking-wide

                `;

            }


            /*
                Через секунду показываем
                "ИГРАТЬ СНОВА".

                Поле при этом НЕ меняется.
            */

            setTimeout(
                () => {

                    if (
                        minesGameState ===
                        'finished'
                    ) {

                        mBtn.innerText =
                            'ИГРАТЬ СНОВА';


                        mBtn.className = `

                            btn-tucha

                            w-full

                            bg-blue-500

                            text-white

                            font-extrabold

                            py-4

                            rounded-2xl

                            text-xl

                            uppercase

                            tracking-wide

                        `;

                    }

                },
                900
            );

        }


        /* =========================================
           START
        ========================================= */

        updateBalanceDisplay();


        /*
            Инициализация Crash.
        */

        startCrashLoop();


    </script>


</body>

</html>

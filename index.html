<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Tucha Games</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #070b16;
            color: #fff;
            user-select: none;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        /* =========================================
           ОСНОВНОЙ ФОН
        ========================================= */

        .app-bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(35, 87, 180, 0.30) 0%,
                    rgba(11, 18, 35, 0.12) 35%,
                    rgba(5, 8, 17, 1) 75%
                ),
                #070b16;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.55;

            background-image:
                radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1px);

            background-size: 80px 80px, 130px 130px;
            background-position: 10px 20px, 40px 70px;

            animation: starsMove 20s linear infinite;
        }

        @keyframes starsMove {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(80px);
            }
        }

        /* =========================================
           APP
        ========================================= */

        #app {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;

            padding:
                env(safe-area-inset-top)
                12px
                calc(88px + env(safe-area-inset-bottom))
                12px;
        }

        #app::-webkit-scrollbar {
            display: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* =========================================
           TOP BAR
        ========================================= */

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 50;

            display: flex;
            justify-content: space-between;
            align-items: center;

            height: 58px;

            padding: 7px 5px;

            background: rgba(7, 11, 22, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-cloud {
            width: 39px;
            height: 39px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    145deg,
                    rgba(59, 130, 246, .22),
                    rgba(30, 64, 175, .10)
                );

            border: 1px solid rgba(96, 165, 250, .18);

            font-size: 24px;
        }

        .brand-title {
            font-size: 17px;
            line-height: 17px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .brand-subtitle {
            color: #6fa8ff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.4px;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .balance-box {
            height: 39px;

            display: flex;
            align-items: center;
            gap: 6px;

            padding: 0 12px;

            border-radius: 13px;

            background: rgba(22, 30, 50, .9);
            border: 1px solid rgba(100, 116, 139, .25);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.03),
                0 8px 25px rgba(0,0,0,.15);
        }

        .balance-symbol {
            color: #60a5fa;
            font-size: 17px;
            font-weight: 700;
        }

        .balance-value {
            font-size: 15px;
            font-weight: 700;
        }

        .plus-btn {
            width: 39px;
            height: 39px;

            border: 0;
            border-radius: 13px;

            background: #2563eb;
            color: white;

            font-size: 23px;
            font-weight: 500;

            box-shadow:
                0 5px 18px rgba(37, 99, 235, .35);
        }

        .plus-btn:active {
            transform: scale(.93);
        }

        /* =========================================
           CRASH
        ========================================= */

        .crash-page {
            padding-top: 3px;
        }

        /* Верхняя строка Crash */

        .crash-top-info {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin: 4px 2px 8px;
        }

        .players-online {
            display: flex;
            align-items: center;
            gap: 6px;

            color: #8e9bb3;
            font-size: 12px;
            font-weight: 600;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;

            box-shadow: 0 0 9px rgba(34,197,94,.8);
        }

        .round-status {
            color: #66748d;
            font-size: 11px;
            font-weight: 600;
        }

        /* =========================================
           ИГРОВАЯ ЗОНА
        ========================================= */

        .crash-stage {
            position: relative;

            width: 100%;
            height: 285px;

            overflow: hidden;

            border-radius: 25px;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(37, 99, 235, .12),
                    transparent 52%
                ),
                linear-gradient(
                    180deg,
                    rgba(15, 23, 42, .30),
                    rgba(2, 6, 23, .05)
                );

            border: 1px solid rgba(71, 85, 105, .13);
        }

        /* декоративная линия полёта */

        .flight-line {
            position: absolute;

            left: 8%;
            right: 8%;
            bottom: 67px;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(59,130,246,.22),
                    transparent
                );

            opacity: .7;
        }

        .flight-glow {
            position: absolute;

            left: 50%;
            top: 43%;

            width: 170px;
            height: 170px;

            transform: translate(-50%, -50%);

            background: radial-gradient(
                circle,
                rgba(37, 99, 235, .17),
                transparent 70%
            );

            filter: blur(12px);

            pointer-events: none;
        }

        .rocket-wrap {
            position: absolute;

            left: 50%;
            top: 45%;

            width: 110px;
            height: 110px;

            display: flex;
            align-items: center;
            justify-content: center;

            transform: translate(-50%, -50%);

            z-index: 5;
        }

        .rocket-img {
            width: 92px;
            height: 92px;

            object-fit: contain;

            filter:
                drop-shadow(0 0 10px rgba(59,130,246,.55))
                drop-shadow(0 8px 15px rgba(0,0,0,.55));

            transform-origin: center;
        }

        .rocket-img.flying {
            animation:
                rocketFloat .55s ease-in-out infinite alternate;
        }

        @keyframes rocketFloat {
            from {
                transform: translateY(2px) rotate(1deg);
            }

            to {
                transform: translateY(-6px) rotate(4deg);
            }
        }

        .rocket-img.crashed {
            animation: none;

            filter:
                grayscale(1)
                opacity(.55)
                drop-shadow(0 4px 8px rgba(0,0,0,.5));

            transform:
                rotate(135deg)
                translateY(8px);
        }

        /* Точка коэффициента */

        .multiplier-wrap {
            position: absolute;

            left: 50%;
            top: 66%;

            transform: translate(-50%, -50%);

            z-index: 10;

            text-align: center;
        }

        .multiplier {
            font-size: 42px;
            line-height: 1;

            font-weight: 700;

            letter-spacing: -1px;

            text-shadow:
                0 4px 15px rgba(0,0,0,.8);
        }

        .multiplier-small {
            margin-top: 5px;

            color: #6e7b91;

            font-size: 10px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 1.3px;
        }

        .waiting-text {
            font-size: 22px;
            font-weight: 700;

            color: #dce5f5;

            text-shadow:
                0 4px 14px rgba(0,0,0,.7);
        }

        .crash-message {
            font-size: 27px;
            font-weight: 700;

            color: #ef4444;

            text-shadow:
                0 0 22px rgba(239,68,68,.25),
                0 4px 12px rgba(0,0,0,.8);
        }

        /* =========================================
           ИСТОРИЯ
        ========================================= */

        .history-title {
            margin: 8px 2px 6px;

            color: #68768d;

            font-size: 10px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .crash-history {
            display: flex;
            gap: 6px;

            overflow-x: auto;

            padding: 2px 1px 6px;

            scrollbar-width: none;
        }

        .crash-history::-webkit-scrollbar {
            display: none;
        }

        .history-pill {
            flex: 0 0 auto;

            min-width: 48px;
            height: 27px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 10px;

            border-radius: 9px;

            background: rgba(20, 28, 47, .88);

            border: 1px solid rgba(71,85,105,.22);

            color: #9aa8bd;

            font-size: 11px;
            font-weight: 700;
        }

        .history-pill.low {
            color: #60a5fa;
        }

        .history-pill.medium {
            color: #a78bfa;
        }

        .history-pill.high {
            color: #34d399;
        }

        /* =========================================
           BET AREA
        ========================================= */

        .bet-panel {
            margin-top: 5px;

            padding: 11px;

            border-radius: 20px;

            background: rgba(13, 20, 35, .88);

            border: 1px solid rgba(71,85,105,.18);

            box-shadow:
                0 15px 40px rgba(0,0,0,.18);
        }

        .bet-row {
            display: flex;
            gap: 8px;
        }

        .bet-input-wrap {
            position: relative;

            flex: 1;
        }

        .bet-input {
            width: 100%;
            height: 50px;

            padding:
                0 45px 0 15px;

            border: 1px solid rgba(71,85,105,.25);
            border-radius: 15px;

            outline: none;

            background: rgba(7, 12, 24, .95);

            color: white;

            font-size: 17px;
            font-weight: 700;

            text-align: left;
        }

        .bet-input:focus {
            border-color: rgba(59,130,246,.55);
        }

        .currency-inside {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: #64748b;

            font-size: 15px;
            font-weight: 700;
        }

        .bet-main-btn {
            flex: 1.25;

            min-height: 50px;

            border: 0;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #2563eb
                );

            color: white;

            font-size: 14px;
            font-weight: 700;

            letter-spacing: .5px;

            box-shadow:
                0 7px 22px rgba(37,99,235,.25);

            transition: .12s ease;
        }

        .bet-main-btn:active:not(:disabled) {
            transform: translateY(2px) scale(.99);
        }

        .bet-main-btn:disabled {
            background: #273247;
            color: #78859a;
            box-shadow: none;
        }

        .bet-main-btn.cashout {
            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            box-shadow:
                0 7px 22px rgba(34,197,94,.20);
        }

        /* =========================================
           LIVE BETS
        ========================================= */

        .live-bets-panel {
            margin-top: 10px;

            padding: 12px;

            border-radius: 21px;

            background:
                linear-gradient(
                    180deg,
                    rgba(17,25,43,.95),
                    rgba(10,16,29,.95)
                );

            border: 1px solid rgba(71,85,105,.17);
        }

        .live-bets-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 9px;
        }

        .live-bets-title {
            color: #d6deeb;

            font-size: 12px;
            font-weight: 700;
        }

        .live-bets-count {
            color: #58667d;

            font-size: 10px;
            font-weight: 600;
        }

        #live-bets {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .player-bet {
            min-height: 47px;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto
                auto;

            align-items: center;

            gap: 8px;

            padding: 6px 8px;

            border-radius: 13px;

            background: rgba(8,14,26,.65);

            border: 1px solid rgba(51,65,85,.14);

            transition: .2s ease;
        }

        .player-bet.you {
            background: rgba(30,64,175,.17);

            border-color:
                rgba(59,130,246,.25);
        }

        .player-info {
            min-width: 0;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-avatar {
            width: 31px;
            height: 31px;

            flex: 0 0 31px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 50%;

            background: #202b40;

            font-size: 16px;
        }

        .player-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .player-name {
            min-width: 0;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: #d7dfec;

            font-size: 11px;
            font-weight: 600;
        }

        .player-bet-amount {
            color: #8491a6;

            font-size: 10px;
            font-weight: 600;
        }

        .player-mult {
            min-width: 38px;

            color: #4ade80;

            font-size: 11px;
            font-weight: 700;

            text-align: right;
        }

        .player-mult.waiting {
            color: #64748b;
        }

        .player-mult.crashed {
            color: #ef4444;
        }

        /* =========================================
           MINES
        ========================================= */

        .mines-page {
            padding-top: 8px;
        }

        .mines-title {
            margin-bottom: 14px;

            text-align: center;

            font-size: 23px;
            font-weight: 700;
        }

        .mines-grid {
            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 7px;

            margin-bottom: 13px;
        }

        .mine-cell {
            aspect-ratio: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    #1a263b,
                    #111a2c
                );

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.025),
                0 5px 10px rgba(0,0,0,.16);

            cursor: pointer;

            font-size: 20px;

            transition: .16s ease;
        }

        .mine-cell:active {
            transform: scale(.94);
        }

        .mine-cell.safe {
            background:
                linear-gradient(
                    145deg,
                    #2563eb,
                    #1d4ed8
                );

            animation: minePop .2s ease-out;
        }

        .mine-cell.bomb {
            background:
                linear-gradient(
                    145deg,
                    #dc2626,
                    #991b1b
                );

            animation: minePop .2s ease-out;
        }

        .mine-cell img {
            width: 30px;
            height: 30px;

            object-fit: contain;
        }

        @keyframes minePop {
            from {
                transform: scale(.75);
            }

            to {
                transform: scale(1);
            }
        }

        .mines-panel {
            padding: 14px;

            border-radius: 21px;

            background: rgba(13,20,35,.92);

            border: 1px solid rgba(71,85,105,.18);
        }

        .field-label {
            display: block;

            margin-bottom: 7px;

            color: #78869c;

            font-size: 11px;
            font-weight: 600;
        }

        .number-input {
            width: 100%;
            height: 49px;

            padding: 0 14px;

            border: 1px solid rgba(71,85,105,.25);
            border-radius: 14px;

            outline: none;

            background: #080e1b;

            color: white;

            font-size: 17px;
            font-weight: 700;
        }

        .mine-slider-box {
            margin-top: 12px;

            padding: 13px;

            border-radius: 15px;

            background: rgba(7,12,23,.7);

            border: 1px solid rgba(71,85,105,.14);
        }

        .slider-top {
            display: flex;
            justify-content: space-between;

            margin-bottom: 11px;
        }

        .slider-label {
            color: #8c99ad;

            font-size: 11px;
            font-weight: 600;
        }

        .slider-value {
            color: #facc15;

            font-size: 14px;
            font-weight: 700;
        }

        input[type=range] {
            width: 100%;

            appearance: none;
            -webkit-appearance: none;

            height: 5px;

            background: #253148;

            border-radius: 10px;

            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background: #facc15;

            box-shadow:
                0 2px 8px rgba(0,0,0,.5);
        }

        .mine-multiplier {
            margin: 12px 0;

            text-align: center;

            color: #4ade80;

            font-size: 16px;
            font-weight: 700;
        }

        /* =========================================
           PROFILE
        ========================================= */

        .profile-page {
            padding-top: 20px;
        }

        .profile-card {
            padding: 22px 16px;

            border-radius: 24px;

            text-align: center;

            background:
                linear-gradient(
                    180deg,
                    rgba(18,27,46,.95),
                    rgba(10,16,29,.95)
                );

            border: 1px solid rgba(71,85,105,.18);
        }

        .profile-avatar {
            width: 88px;
            height: 88px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 50%;

            background: #202b40;

            border: 3px solid rgba(59,130,246,.35);

            font-size: 38px;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            margin-bottom: 5px;

            font-size: 23px;
            font-weight: 700;
        }

        .profile-balance {
            margin: 16px auto;

            width: fit-content;

            padding: 9px 20px;

            border-radius: 14px;

            background: rgba(7,12,23,.75);

            color: #4ade80;

            font-size: 25px;
            font-weight: 700;
        }

        .bonus-btn {
            width: 100%;

            min-height: 50px;

            border: 0;
            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            color: white;

            font-size: 14px;
            font-weight: 700;

            box-shadow:
                0 8px 22px rgba(34,197,94,.20);
        }

        /* =========================================
           BOTTOM NAV
        ========================================= */

        .bottom-nav {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 100;

            padding:
                6px
                8px
                calc(6px + env(safe-area-inset-bottom));

            background:
                rgba(6,10,20,.92);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-top:
                1px solid rgba(71,85,105,.18);
        }

        .nav-inner {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            max-width: 500px;

            margin: 0 auto;
        }

        .nav-btn {
            border: 0;

            background: transparent;

            color: #536078;

            padding: 6px 4px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 2px;

            transition: .15s ease;
        }

        .nav-btn.active {
            color: #60a5fa;
        }

        .nav-icon {
            width: 28px;
            height: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
        }

        .nav-icon img {
            width: 25px;
            height: 25px;

            object-fit: contain;
        }

        .nav-label {
            font-size: 9px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: .7px;
        }

        /* =========================================
           ANIMATIONS
        ========================================= */

        .pulse-soft {
            animation: pulseSoft 1.1s ease-in-out infinite;
        }

        @keyframes pulseSoft {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: .6;
            }
        }

        /* =========================================
           SMALL SCREENS
        ========================================= */

        @media (max-height: 650px) {
            .crash-stage {
                height: 235px;
            }

            .rocket-img {
                width: 78px;
                height: 78px;
            }

            .rocket-wrap {
                width: 95px;
                height: 95px;
            }

            .multiplier {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <div class="app-bg"></div>
    <div class="stars"></div>

    <!-- =========================================
         ВЕРХНЯЯ ПАНЕЛЬ
    ========================================== -->

    <header class="top-bar">

        <div class="brand">
            <div class="brand-cloud">
                ☁️
            </div>

            <div>
                <div class="brand-title">
                    TUCHA
                </div>

                <div class="brand-subtitle">
                    GAMES
                </div>
            </div>
        </div>

        <div class="top-right">

            <div class="balance-box">
                <span class="balance-symbol">$</span>

                <span
                    id="header-balance"
                    class="balance-value"
                >
                    0.00
                </span>
            </div>

            <button
                class="plus-btn"
                onclick="openDeposit()"
            >
                +
            </button>

        </div>

    </header>


    <!-- =========================================
         APP
    ========================================== -->

    <main id="app">

        <!-- =====================================
             CRASH
        ====================================== -->

        <section
            id="tab-crash"
            class="tab-content active"
        >

    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        /* =========================================
           TELEGRAM
        ========================================= */

        const tg = window.Telegram.WebApp;

        tg.expand();

        try {
            tg.setHeaderColor('#070b16');
            tg.setBackgroundColor('#070b16');
        } catch (e) {}


        /* =========================================
           USER
        ========================================= */

        let userId = "default_user";

        let userName = "Игрок";

        let userAvatarHTML = "👤";


        if (
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user
        ) {

            userId = String(
                tg.initDataUnsafe.user.id
            );

            userName =
                tg.initDataUnsafe.user.first_name ||
                "Игрок";


            if (
                tg.initDataUnsafe.user.photo_url
            ) {

                userAvatarHTML = `
                    <img
                        src="${tg.initDataUnsafe.user.photo_url}"
                        alt=""
                    >
                `;
            }
        }


        /* =========================================
           STORAGE
        ========================================= */

        const storageKeys = {

            balance:
                `tucha_balance_${userId}`,

            bonusCount:
                `tucha_bonus_count_${userId}`

        };


        let balance =
            parseFloat(
                localStorage.getItem(
                    storageKeys.balance
                )
            );


        if (isNaN(balance)) {

            balance = 1.00;

        }


        let bonusCount =
            parseInt(
                localStorage.getItem(
                    storageKeys.bonusCount
                )
            ) || 0;


        function saveStats() {

            localStorage.setItem(
                storageKeys.balance,
                balance.toFixed(2)
            );

            localStorage.setItem(
                storageKeys.bonusCount,
                bonusCount
            );

        }


        /* =========================================
           DOM
        ========================================= */

        document.getElementById(
            'tg-name'
        ).innerText = userName;


        document.getElementById(
            'tg-avatar'
        ).innerHTML = userAvatarHTML;


        const bonusBtn =
            document.getElementById(
                'test-bonus-btn'
            );


        const bonusLeftSpan =
            document.getElementById(
                'bonus-left'
            );


        /* =========================================
           BONUS
        ========================================= */

        function updateBonusButton() {

            const left =
                2 - bonusCount;


            if (left <= 0) {

                bonusBtn.style.display =
                    'none';

            } else {

                bonusLeftSpan.innerText =
                    left;
            }

        }


        updateBonusButton();


        /* =========================================
           BALANCE
        ========================================= */

        function updateBalanceDisplay() {

            const formatted =
                balance.toFixed(2);


            document.getElementById(
                'header-balance'
            ).innerText =
                formatted;


            document.getElementById(
                'profile-balance'
            ).innerText =
                formatted;


            saveStats();

        }


        function claimTestBonus() {

            if (bonusCount >= 2) {
                return;
            }


            balance += 1.00;

            bonusCount++;


            updateBonusButton();

            updateBalanceDisplay();


            try {
                tg.HapticFeedback
                    .notificationOccurred(
                        'success'
                    );
            } catch (e) {}

        }


        function openDeposit() {

            try {

                tg.HapticFeedback
                    .impactOccurred(
                        'light'
                    );

            } catch (e) {}


            alert(
                'Пополнение будет подключено позже.'
            );

        }


        /* =========================================
           NAVIGATION
        ========================================= */

        function switchTab(tabId) {

            document
                .querySelectorAll(
                    '.tab-content'
                )
                .forEach(
                    element => {
                        element.classList
                            .remove('active');
                    }
                );


            document
                .getElementById(
                    'tab-' + tabId
                )
                .classList
                .add('active');


            document
                .querySelectorAll(
                    '.nav-btn'
                )
                .forEach(
                    button => {

                        button.classList
                            .remove('active');


                        if (
                            button.dataset.tab ===
                            tabId
                        ) {

                            button.classList
                                .add('active');

                        }

                    }
                );


            try {

                tg.HapticFeedback
                    .impactOccurred(
                        'light'
                    );

            } catch (e) {}

        }


        /* =========================================
           CRASH VARIABLES
        ========================================= */

        let crashState = 'waiting';

        let currentCrashMult = 1.00;

        let userCrashBet = 0;

        let userInCrash = false;

        let targetCrashPoint = 1.00;

        let flyInterval = null;

        let fakePlayers = [];

        let playerUpdateInterval = null;


        const rocketWrap =
            document.getElementById(
                'rocket-wrap'
            );


        const rocketImg =
            document.getElementById(
                'rocket'
            );


        const rktTimer =
            document.getElementById(
                'crash-timer'
            );


        const rktMult =
            document.getElementById(
                'multiplier'
            );


        const rktCaption =
            document.getElementById(
                'multiplier-caption'
            );


        const rktMsg =
            document.getElementById(
                'crash-msg'
            );


        const rktBtn =
            document.getElementById(
                'btn-crash-action'
            );


        const liveBetsContainer =
            document.getElementById(
                'live-bets'
            );


        const liveBetsCount =
            document.getElementById(
                'live-bets-count'
            );


        const crashHistoryContainer =
            document.getElementById(
                'crash-history'
            );


        const roundStatus =
            document.getElementById(
                'round-status'
            );


        /* =========================================
           RANDOM PLAYER DATA
        ========================================= */

        const randomNames = [

            'Маша',
            'Саня',
            'Crypto',
            'Макс',
            'Даня',
            'Tucha',
            'Алекс',
            'Влад',
            'Maga',
            'Lucky',
            'Дима',
            'Артур',
            'Nika',
            'Roman',
            'Fire',
            'Leo',
            'Миша',
            'Storm',
            'Fox',
            'Moon'

        ];


        const avatarList = [

            '👤',
            '🧑',
            '👨',
            '👩',
            '😎',
            '🤠',
            '🧔',
            '👨‍💻',
            '🧑‍🚀',
            '🐱',
            '🐼',
            '🦊',
            '🐸'

        ];


        function randomName() {

            return randomNames[
                Math.floor(
                    Math.random() *
                    randomNames.length
                )
            ];

        }


        function randomAvatar() {

            return avatarList[
                Math.floor(
                    Math.random() *
                    avatarList.length
                )
            ];

        }


        function randomBetAmount() {

            /*
                Большинство ставок маленькие.
                Крупные появляются реже.
            */

            const random =
                Math.random();


            if (random < 0.55) {

                return (
                    Math.random() *
                    0.45 +
                    0.10
                );

            }


            if (random < 0.85) {

                return (
                    Math.random() *
                    0.9 +
                    0.35
                );

            }


            return (
                Math.random() *
                2.2 +
                0.8
            );

        }


        function randomCashout() {

            const random =
                Math.random();


            if (random < 0.55) {

                return (
                    Math.random() *
                    0.65 +
                    1.10
                );

            }


            if (random < 0.88) {

                return (
                    Math.random() *
                    1.5 +
                    1.25
                );

            }


            return (
                Math.random() *
                2.2 +
                1.5
            );

        }


        /* =========================================
           CREATE FAKE PLAYERS
        ========================================= */

        function createFakePlayers() {

            fakePlayers = [];


            const amount =
                Math.floor(
                    Math.random() * 3
                ) + 3;


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                fakePlayers.push({

                    name: randomName(),

                    avatar: randomAvatar(),

                    bet: randomBetAmount(),

                    cashoutAt: randomCashout(),

                    currentMult: 1.00,

                    status: 'waiting',

                    win: 0

                });

            }

        }


        /* =========================================
           RENDER PLAYERS
        ========================================= */

        function renderFakePlayers() {

            liveBetsContainer.innerHTML = '';


            /*
                Сначала показываем пользователя,
                если он поставил.
            */

            if (userInCrash) {

                const userHTML = `

                    <div class="player-bet you">

                        <div class="player-info">

                            <div class="player-avatar">
                                ${userAvatarHTML}
                            </div>

                            <div style="min-width:0">

                                <div class="player-name">
                                    ${escapeHTML(userName)}
                                </div>

                                <div class="player-bet-amount">
                                    $${userCrashBet.toFixed(2)}
                                </div>

                            </div>

                        </div>

                        <div
                            id="user-live-mult"
                            class="player-mult waiting"
                        >
                            1.00x
                        </div>

                        <div
                            id="user-live-win"
                            class="player-bet-amount"
                        >
                            —
                        </div>

                    </div>

                `;

                liveBetsContainer
                    .insertAdjacentHTML(
                        'beforeend',
                        userHTML
                    );

            }


            fakePlayers.forEach(
                (player, index) => {

                    const multiplierText =
                        player.status === 'waiting'
                            ? '1.00x'
                            : player.status === 'active'
                                ? player.currentMult.toFixed(2) + 'x'
                                : player.status === 'cashed'
                                    ? player.cashoutAt.toFixed(2) + 'x'
                                    : 'КРАШ';


                    const multiplierClass =
                        player.status === 'active'
                            ? ''
                            : player.status === 'cashed'
                                ? ''
                                : player.status === 'crashed'
                                    ? 'crashed'
                                    : 'waiting';


                    const winText =
                        player.status === 'cashed'
                            ? '$' +
                              player.win.toFixed(2)
                            : '';


                    const html = `

                        <div class="player-bet">

                            <div class="player-info">

                                <div class="player-avatar">
                                    ${player.avatar}
                                </div>

                                <div style="min-width:0">

                                    <div class="player-name">
                                        ${escapeHTML(player.name)}
                                    </div>

                                    <div class="player-bet-amount">
                                        $${player.bet.toFixed(2)}
                                    </div>

                                </div>

                            </div>

                            <div
                                id="fake-mult-${index}"
                                class="player-mult ${multiplierClass}"
                            >
                                ${multiplierText}
                            </div>

                            <div
                                id="fake-win-${index}"
                                class="player-bet-amount"
                            >
                                ${winText}
                            </div>

                        </div>

                    `;


                    liveBetsContainer
                        .insertAdjacentHTML(
                            'beforeend',
                            html
                        );

                }
            );


            liveBetsCount.innerText =
                (
                    fakePlayers.length +
                    (userInCrash ? 1 : 0)
                ) +
                ' ставок';

        }


        function escapeHTML(text) {

            const div =
                document.createElement(
                    'div'
                );

            div.innerText = text;

            return div.innerHTML;

        }


        /* =========================================
           UPDATE PLAYER MULTIPLIERS
        ========================================= */

        function updateFakePlayers() {

            fakePlayers.forEach(
                (player, index) => {

                    if (
                        player.status ===
                        'waiting'
                    ) {

                        player.status =
                            'active';

                    }


                    if (
                        player.status ===
                        'active'
                    ) {

                        player.currentMult =
                            currentCrashMult;


                        /*
                            Игрок забирает ставку,
                            когда достигает своего
                            случайного коэффициента.
                        */

                        if (
                            currentCrashMult >=
                            player.cashoutAt
                        ) {

                            player.status =
                                'cashed';


                            player.win =
                                player.bet *
                                player.cashoutAt;

                        }

                    }


                    const multElement =
                        document.getElementById(
                            'fake-mult-' +
                            index
                        );


                    const winElement =
                        document.getElementById(
                            'fake-win-' +
                            index
                        );


                    if (
                        !multElement
                    ) {
                        return;
                    }


                    if (
                        player.status ===
                        'active'
                    ) {

                        multElement.innerText =
                            currentCrashMult.toFixed(2)
                            + 'x';

                        multElement.className =
                            'player-mult';


                    } else if (
                        player.status ===
                        'cashed'
                    ) {

                        multElement.innerText =
                            player.cashoutAt
                                .toFixed(2) +
                            'x';

                        multElement.className =
                            'player-mult';


                        if (winElement) {

                            winElement.innerText =
                                '$' +
                                player.win
                                    .toFixed(2);

                        }

                    } else if (
                        player.status ===
                        'crashed'
                    ) {

                        multElement.innerText =
                            'КРАШ';

                        multElement.className =
                            'player-mult crashed';

                    }

                }
            );


            /*
                Пользовательский коэффициент
            */

            if (userInCrash) {

                const userMult =
                    document.getElementById(
                        'user-live-mult'
                    );


                const userWin =
                    document.getElementById(
                        'user-live-win'
                    );


                if (userMult) {

                    userMult.innerText =
                        currentCrashMult.toFixed(2)
                        + 'x';

                    userMult.className =
                        'player-mult';

                }


                if (userWin) {

                    userWin.innerText =
                        '$' +
                        (
                            userCrashBet *
                            currentCrashMult
                        ).toFixed(2);

                }

            }

        }


        /* =========================================
           CRASH HISTORY
        ========================================= */

        function addCrashHistory(mult) {

            const span =
                document.createElement(
                    'span'
                );


            span.className =
                'history-pill';


            if (mult < 1.5) {

                span.classList.add(
                    'low'
                );

            } else if (
                mult < 3
            ) {

                span.classList.add(
                    'medium'
                );

            } else {

                span.classList.add(
                    'high'
                );

            }


            span.innerText =
                mult.toFixed(2) + 'x';


            crashHistoryContainer
                .prepend(span);


            while (
                crashHistoryContainer
                    .children.length > 9
            ) {

                crashHistoryContainer
                    .lastElementChild
                    .remove();

            }

        }


        function generateInitialHistory() {

            const values = [

                1.44,
                1.00,
                2.18,
                1.29,
                1.67,
                3.12,
                1.13,
                2.44,
                1.78

            ];


            values.forEach(
                value => {

                    addCrashHistory(
                        value
                    );

                }
            );

        }


        /* =========================================
           CRASH LOOP
        ========================================= */

        function startCrashLoop() {

            clearInterval(
                flyInterval
            );


            clearInterval(
                playerUpdateInterval
            );


            crashState =
                'waiting';


            userInCrash =
                false;


            userCrashBet =
                0;


            currentCrashMult =
                1.00;


            createFakePlayers();

            renderFakePlayers();


            /*
                Сбрасываем ракету.
            */

            rocketWrap.style.display =
                'flex';


            rocketImg.className =
                'rocket-img flying';


            rktMult.style.display =
                'none';


            rktCaption.style.display =
                'none';


            rktMsg.style.display =
                'none';


            rktTimer.style.display =
                'block';


            rktBtn.disabled =
                false;


            rktBtn.className =
                'bet-main-btn';


            rktBtn.innerText =
                'СДЕЛАТЬ СТАВКУ';


            roundStatus.innerText =
                'Новый раунд';


            roundStatus.className =
                'round-status';


            let timer = 5;


            rktTimer.innerText =
                'СТАРТ ЧЕРЕЗ ' +
                timer;


            /*
                Обновляем игроков даже во время
                ожидания, чтобы список выглядел живым.
            */

            playerUpdateInterval =
                setInterval(
                    () => {

                        renderFakePlayers();

                    },
                    1200
                );


            const countInterval =
                setInterval(
                    () => {

                        timer--;


                        if (
                            timer > 0
                        ) {

                            rktTimer.innerText =
                                'СТАРТ ЧЕРЕЗ ' +
                                timer;

                        }


                        if (
                            timer <= 0
                        ) {

                            clearInterval(
                                countInterval
                            );

                            flyCrash();

                        }

                    },
                    1000
                );

        }


        /* =========================================
           START FLY
        ========================================= */

        function flyCrash() {

            clearInterval(
                playerUpdateInterval
            );


            crashState =
                'flying';


            rktTimer.style.display =
                'none';


            rocketWrap.style.display =
                'flex';


            rocketImg.className =
                'rocket-img flying';


            rktMult.style.display =
                'block';


            rktCaption.style.display =
                'block';


            rktMsg.style.display =
                'none';


            currentCrashMult =
                1.00;


            /*
                Не делаем огромные коэффициенты.
                Большинство раундов заканчиваются
                примерно в диапазоне 1.2 - 5.
            */

            targetCrashPoint =
                parseFloat(
                    (
                        Math.random() *
                        3.8 +
                        1.20
                    ).toFixed(2)
                );


            /*
                Редкий высокий раунд.
            */

            if (
                Math.random() < 0.07
            ) {

                targetCrashPoint =
                    parseFloat(
                        (
                            Math.random() *
                            7 +
                            5
                        ).toFixed(2)
                    );

            }


            /*
                Fake players начинаются
                одновременно с раундом.
            */

            fakePlayers.forEach(
                player => {

                    player.status =
                        'active';

                    player.currentMult =
                        1.00;

                }
            );


            renderFakePlayers();


            roundStatus.innerText =
                'Раунд идёт';


            rktMult.innerText =
                '1.00x';


            /*
                Если пользователь поставил —
                показываем Cash Out.
            */

            if (userInCrash) {

                rktBtn.disabled =
                    false;

                rktBtn.innerText =
                    'ЗАБРАТЬ $' +
                    (
                        userCrashBet *
                        currentCrashMult
                    ).toFixed(2);

                rktBtn.className =
                    'bet-main-btn cashout';

            } else {

                rktBtn.disabled =
                    true;

                rktBtn.innerText =
                    'ПОЛЁТ...';

                rktBtn.className =
                    'bet-main-btn';

            }


            flyInterval =
                setInterval(
                    () => {

                        /*
                            Скорость роста
                            коэффициента.
                        */

                        currentCrashMult +=
                            0.01;


                        rktMult.innerText =
                            currentCrashMult
                                .toFixed(2) +
                            'x';


                        /*
                            Обновляем игроков.
                        */

                        updateFakePlayers();


                        /*
                            Пользовательская кнопка.
                        */

                        if (
                            userInCrash
                        ) {

                            rktBtn.innerText =
                                'ЗАБРАТЬ $' +
                                (
                                    userCrashBet *
                                    currentCrashMult
                                ).toFixed(2);

                        }


                        /*
                            Краш.
                        */

                        if (
                            currentCrashMult >=
                            targetCrashPoint
                        ) {

                            clearInterval(
                                flyInterval
                            );

                            doCrash();

                        }

                    },
                    60
                );

        }


        /* =========================================
           CRASH
        ========================================= */

        function doCrash() {

            clearInterval(
                flyInterval
            );


            crashState =
                'crashed';


            /*
                Игроки, которые не успели
                забрать выигрыш, проигрывают.
            */

            fakePlayers.forEach(
                player => {

                    if (
                        player.status ===
                        'active'
                    ) {

                        player.status =
                            'crashed';

                    }

                }
            );


            renderFakePlayers();


            rocketImg.className =
                'rocket-img crashed';


            rktMult.style.display =
                'none';


            rktCaption.style.display =
                'none';


            rktMsg.style.display =
                'block';


            rktMsg.innerText =
                'КРАШ ' +
                targetCrashPoint.toFixed(2) +
                'x';


            roundStatus.innerText =
                'Раунд завершён';


            addCrashHistory(
                targetCrashPoint
            );


            try {

                tg.HapticFeedback
                    .notificationOccurred(
                        'error'
                    );

            } catch (e) {}


            /*
                Если пользователь остался
                в раунде — ставка проиграна.
            */

            if (userInCrash) {

                userInCrash =
                    false;

                userCrashBet =
                    0;

            }


            rktBtn.disabled =
                true;


            rktBtn.className =
                'bet-main-btn';


            rktBtn.innerText =
                'ПРОИГРЫШ';


            /*
                Через 3 секунды новый раунд.
            */

            setTimeout(
                () => {

                    startCrashLoop();

                },
                3000
            );

        }


        /* =========================================
           CRASH BUTTON
        ========================================= */

        function handleCrashAction() {

            /*
                СТАВКА
            */

            if (
                crashState ===
                'waiting'
            ) {

                const input =
                    document.getElementById(
                        'crash-bet'
                    );


                const bet =
                    parseFloat(
                        input.value
                    );


                if (
                    bet > balance ||
                    bet <= 0 ||
                    isNaN(bet)
                ) {

                    try {

                        tg.HapticFeedback
                            .notificationOccurred(
                                'error'
                            );

                    } catch (e) {}


                    alert(
                        'Недостаточно средств или неверная ставка!'
                    );

                    return;

                }


                balance -= bet;


                userCrashBet =
                    bet;


                userInCrash =
                    true;


                updateBalanceDisplay();


                renderFakePlayers();


                rktBtn.innerText =
                    'СТАВКА ПРИНЯТА';


                rktBtn.disabled =
                    true;


                rktBtn.className =
                    'bet-main-btn';


                try {

                    tg.HapticFeedback
                        .impactOccurred(
                            'medium'
                        );

                } catch (e) {}

            }


            /*
                CASH OUT
            */

            else if (
                crashState === 'flying' &&
                userInCrash
            ) {

                const win =
                    userCrashBet *
                    currentCrashMult;


                balance += win;


                userInCrash =
                    false;


                const wonAmount =
                    win;


                updateBalanceDisplay();


                rktBtn.disabled =
                    true;


                rktBtn.innerText =
                    'ВЫИГРАНО $' +
                    wonAmount.toFixed(2);


                rktBtn.className =
                    'bet-main-btn';


                try {

                    tg.HapticFeedback
                        .notificationOccurred(
                            'success'
                        );

                } catch (e) {}

            }

        }


        /* =========================================
           MINES
        ========================================= */

        let minesGameState =
            'idle';

        let minesPositions = [];

        let currentMineBet =
            0;

        let currentMineMult =
            1.00;

        let safeClicksCount =
            0;

        let totalBombs =
            3;


        const mGrid =
            document.getElementById(
                'mines-grid'
            );


        const mBtn =
            document.getElementById(
                'btn-mines-action'
            );


        const mMultDisp =
            document.getElementById(
                'mines-multiplier-display'
            );


        const mMultVal =
            document.getElementById(
                'current-mine-mult'
            );


        /* =========================================
           MINES GRID
        ========================================= */

        function buildMinesGrid() {

            mGrid.innerHTML =
                '';


            for (
                let i = 0;
                i < 25;
                i++
            ) {

                const cell =
                    document.createElement(
                        'div'
                    );


                cell.className =
                    'mine-cell';


                cell.dataset.index =
                    i;


                cell.innerHTML =
                    '';


                mGrid.appendChild(
                    cell
                );

            }

        }


        buildMinesGrid();


        /* =========================================
           MINES ACTION
        ========================================= */

        function handleMinesAction() {

            /*
                START
            */

            if (
                minesGameState ===
                'idle'
            ) {

                const bet =
                    parseFloat(
                        document.getElementById(
                            'mines-bet'
                        ).value
                    );


                if (
                    bet > balance ||
                    bet <= 0 ||
                    isNaN(bet)
                ) {

                    try {

                        tg.HapticFeedback
                            .notificationOccurred(
                                'error'
                            );

                    } catch (e) {}


                    alert(
                        'Недостаточно средств или неверная ставка!'
                    );

                    return;

                }


                buildMinesGrid();


                balance -= bet;


                updateBalanceDisplay();


                totalBombs =
                    parseInt(
                        document.getElementById(
                            'mines-slider'
                        ).value
                    );


                currentMineBet =
                    bet;


                currentMineMult =
                    1.00;


                safeClicksCount =
                    0;


                minesGameState =
                    'playing';


                minesPositions =
                    [];


                while (
                    minesPositions.length <
                    totalBombs
                ) {

                    const randomIndex =
                        Math.floor(
                            Math.random() * 25
                        );


                    if (
                        !minesPositions
                            .includes(
                                randomIndex
                            )
                    ) {

                        minesPositions.push(
                            randomIndex
                        );

                    }

                }


                mMultDisp.style.display =
                    'block';


                mMultVal.innerText =
                    currentMineMult.toFixed(2);


                mBtn.innerText =
                    'ВЫБЕРИТЕ ЯЧЕЙКУ';


                mBtn.disabled =
                    true;


                mBtn.className =
                    'bet-main-btn';


                const cells =
                    document.querySelectorAll(
                        '.mine-cell'
                    );


                cells.forEach(
                    cell => {

                        cell.onclick =
                            () => {

                                clickMine(
                                    parseInt(
                                        cell.dataset.index
                                    ),
                                    cell
                                );

                            };

                    }
                );


                return;

            }


            /*
                CASH OUT
            */

            if (
                minesGameState ===
                'playing'
            ) {

                const win =
                    currentMineBet *
                    currentMineMult;


                balance += win;


                updateBalanceDisplay();


                try {

                    tg.HapticFeedback
                        .notificationOccurred(
                            'success'
                        );

                } catch (e) {}


                endMinesGame(
                    'ВЫИГРЫШ $' +
                    win.toFixed(2),
                    'green'
                );

            }

        }


        /* =========================================
           CLICK MINE
        ========================================= */

        function clickMine(
            index,
            cellEl
        ) {

            if (
                minesGameState !==
                'playing'
            ) {

                return;

            }


            cellEl.onclick =
                null;


            /*
                BOMB
            */

            if (
                minesPositions.includes(
                    index
                )
            ) {

                cellEl.classList.add(
                    'bomb'
                );


                cellEl.innerHTML = `

                    <img
                        src="bomb.png"
                        alt=""
                        onerror="this.outerHTML='💣'"
                    >

                `;


                try {

                    tg.HapticFeedback
                        .notificationOccurred(
                            'error'
                        );

                } catch (e) {}


                document
                    .querySelectorAll(
                        '.mine-cell'
                    )
                    .forEach(
                        (cell, i) => {

                            cell.onclick =
                                null;


                            if (
                                minesPositions
                                    .includes(i) &&
                                i !== index
                            ) {

                                cell.classList.add(
                                    'bomb'
                                );


                                cell.innerHTML = `

                                    <img
                                        src="bomb.png"
                                        alt=""
                                        style="opacity:.5"
                                        onerror="this.outerHTML='💣'"
                                    >

                                `;

                            }

                        }
                    );


                endMinesGame(
                    'ПРОИГРЫШ',
                    'red'
                );


                return;

            }


            /*
                SAFE
            */

            cellEl.classList.add(
                'safe'
            );


            cellEl.innerHTML = `

                <img
                    src="star.png"
                    alt=""
                    onerror="this.outerHTML='💎'"
                >

            `;


            try {

                tg.HapticFeedback
                    .impactOccurred(
                        'medium'
                    );

            } catch (e) {}


            safeClicksCount++;


            let prob =
                1.0;


            for (
                let i = 0;
                i < safeClicksCount;
                i++
            ) {

                prob *=
                    (
                        25 -
                        totalBombs -
                        i
                    ) /
                    (
                        25 -
                        i
                    );

            }


            const houseEdge =
                0.95;


            currentMineMult =
                houseEdge /
                prob;


            mMultVal.innerText =
                currentMineMult
                    .toFixed(2);


            const currentWin =
                currentMineBet *
                currentMineMult;


            mBtn.disabled =
                false;


            mBtn.innerText =
                'ЗАБРАТЬ $' +
                currentWin.toFixed(2);


            mBtn.className =
                'bet-main-btn cashout';


            /*
                Все безопасные клетки открыты.
            */

            if (
                safeClicksCount ===
                25 - totalBombs
            ) {

                balance +=
                    currentWin;


                updateBalanceDisplay();


                endMinesGame(
                    'СУПЕР ВЫИГРЫШ $' +
                    currentWin.toFixed(2),
                    'yellow'
                );

            }

        }


        /* =========================================
           END MINES
        ========================================= */

        function endMinesGame(
            message,
            color
        ) {

            minesGameState =
                'idle';


            mBtn.innerText =
                message;


            mBtn.disabled =
                false;


            if (
                color === 'green'
            ) {

                mBtn.className =
                    'bet-main-btn cashout';

            } else if (
                color === 'red'
            ) {

                mBtn.className =
                    'bet-main-btn';

            } else {

                mBtn.className =
                    'bet-main-btn';

            }


            setTimeout(
                () => {

                    if (
                        minesGameState ===
                        'idle'
                    ) {

                        mMultDisp.style.display =
                            'none';


                        mBtn.innerText =
                            'ИГРАТЬ';


                        mBtn.className =
                            'bet-main-btn';

                    }

                },
                3000
            );

        }


        /* =========================================
           INITIAL
        ========================================= */

        updateBalanceDisplay();

        generateInitialHistory();

        startCrashLoop();

    </script>

</body>
</html>

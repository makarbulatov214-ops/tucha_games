<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tucha Games</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; user-select: none; font-family: 'Fredoka', sans-serif; }
        .bg-space { background: radial-gradient(circle at top, #1e3a8a 0%, #0f172a 80%); position: relative; overflow: hidden; }
        .stars { position: absolute; width: 100%; height: 100%; background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat; opacity: 0.4; pointer-events: none; }
        .tab-content { display: none; padding-bottom: 90px; }
        .tab-content.active { display: block; }
        
        /* Ракетка */
        .rocket-container { height: 230px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .rocket-img { width: 85px; height: 85px; object-fit: contain; margin-bottom: 4px; filter: drop-shadow(0 10px 15px rgba(56, 189, 248, 0.6)); z-index: 10; }
        .rocket-img.flying { animation: fly 0.4s infinite alternate; }
        @keyframes fly { from { transform: translateY(0px) rotate(3deg); } to { transform: translateY(-8px) rotate(8deg); } }
        .rocket-img.crashed { filter: grayscale(100%) opacity(70%); transform: rotate(160deg) translateY(15px) !important; animation: none; }
        
        /* Исправленные Мины (чистые ячейки) */
        .mine-cell { aspect-ratio: 1; background: #1e293b; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; border-bottom: 4px solid #0f172a; font-size: 2rem;}
        .mine-cell:active { transform: translateY(4px); border-bottom-width: 0px; margin-top: 4px;}
        .mine-cell.safe { background: #3b82f6; border-bottom-color: #1d4ed8; animation: pop 0.25s ease-out; }
        .mine-cell.bomb { background: #ef4444; border-bottom-color: #b91c1c; animation: pop 0.25s ease-out; }
        @keyframes pop { 0% { transform: scale(0.7); } 100% { transform: scale(1); } }
        
        .btn-tucha { border-bottom: 5px solid rgba(0,0,0,0.3); transition: all 0.1s; }
        .btn-tucha:active:not(:disabled) { transform: translateY(5px); border-bottom: 0px solid rgba(0,0,0,0.3); margin-top: 5px; }
        .btn-tucha:disabled { opacity: 0.7; transform: none; border-bottom: 5px solid rgba(0,0,0,0.3); margin-top: 0; cursor: not-allowed; }
        
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #facc15; cursor: pointer; margin-top: -8px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-space h-screen w-screen overflow-hidden flex flex-col">
    <div class="stars"></div>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="flex justify-between items-center p-4 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40 border-b border-slate-700/50">
        <div class="flex items-center gap-2">
            <span class="text-3xl drop-shadow-md">☁️</span>
            <div class="leading-none flex flex-col justify-center">
                <span class="text-white font-extrabold text-xl leading-tight tracking-wide">TUCHA</span>
                <span class="text-yellow-400 font-extrabold text-sm leading-tight tracking-wide">GAMES</span>
            </div>
        </div>
        <div class="bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-600 shadow-inner flex items-center gap-2">
            <span class="text-green-400 text-lg font-bold">$</span>
            <span id="header-balance" class="font-bold text-white text-lg">0.00</span>
        </div>
    </div>

    <div id="app" class="flex-1 overflow-y-auto relative z-10 p-4">
        
        <!-- РАКЕТКА (КРАШ) -->
        <div id="tab-crash" class="tab-content active">
            <!-- История коэффициентов -->
            <div id="crash-history" class="flex overflow-x-auto pb-2 mb-3 whitespace-nowrap scrollbar-hide gap-2">
                <span class="bg-slate-800/50 px-3 py-1 rounded-full text-xs font-bold text-blue-400 border border-blue-900">1.45x</span>
                <span class="bg-slate-800/50 px-3 py-1 rounded-full text-xs font-bold text-purple-400 border border-purple-900">2.80x</span>
                <span class="bg-slate-800/50 px-3 py-1 rounded-full text-xs font-bold text-green-400 border border-green-900">1.12x</span>
            </div>

            <!-- Игровой экран -->
            <div class="rocket-container bg-slate-800/40 rounded-3xl mb-4 border border-slate-700 shadow-lg">
                <div id="rocket-wrap" style="display:none;" class="flex flex-col items-center">
                    <img src="rocket.gif" id="rocket" class="rocket-img flying" onerror="this.outerHTML='<div class=\'text-6xl mb-2\'>🚀</div>'">
                </div>
                
                <div id="crash-timer" class="text-4xl font-extrabold text-white z-10">ОЖИДАНИЕ</div>
                <div id="multiplier" class="text-5xl font-extrabold text-white z-10 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]" style="display:none;">1.00x</div>
                <div id="crash-msg" class="text-3xl font-extrabold text-red-500 z-10 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]" style="display:none;">КРАШ!</div>
            </div>

            <!-- Ставка -->
            <div class="bg-slate-800/80 backdrop-blur-sm rounded-3xl p-5 mb-4 border border-slate-700">
                <div class="flex justify-between text-sm mb-2 text-slate-400 font-semibold">
                    <span>Сумма ставки ($)</span>
                </div>
                <input type="number" id="crash-bet" value="0.10" step="0.01" class="w-full bg-slate-900 text-white p-4 rounded-2xl text-2xl font-bold text-center mb-4 outline-none border border-slate-700">
                <button id="btn-crash-action" onclick="handleCrashAction()" class="btn-tucha w-full bg-blue-500 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide">Сделать ставку</button>
            </div>
            
            <!-- Текущие ставки -->
            <div class="bg-slate-800/60 rounded-3xl p-4 border border-slate-700">
                <div class="text-sm text-slate-400 mb-3 text-center font-bold uppercase tracking-wider">Текущие ставки раунда</div>
                <div id="live-bets" class="space-y-2 max-h-40 overflow-hidden text-sm font-semibold"></div>
            </div>
        </div>

        <!-- МИНЫ -->
        <div id="tab-mines" class="tab-content">
            <div id="mines-grid" class="grid grid-cols-5 gap-2 mb-6"></div>

            <div class="bg-slate-800/80 backdrop-blur-sm rounded-3xl p-5 border border-slate-700">
                <div class="flex justify-between text-sm mb-2 text-slate-400 font-semibold">
                    <span>Сумма ставки ($)</span>
                </div>
                <input type="number" id="mines-bet" value="0.10" step="0.01" class="w-full bg-slate-900 text-white p-4 rounded-2xl text-2xl font-bold text-center mb-6 outline-none border border-slate-700">
                
                <div class="mb-6 bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                    <div class="flex justify-between text-sm text-slate-300 mb-4 font-bold">
                        <span>Количество бомб 💣</span>
                        <span id="mines-count-val" class="text-yellow-400 text-lg">3</span>
                    </div>
                    <input type="range" id="mines-slider" min="1" max="24" value="3" class="w-full" oninput="document.getElementById('mines-count-val').innerText = this.value;">
                </div>

                <div id="mines-multiplier-display" class="text-center text-green-400 font-bold text-xl mb-4" style="display:none;">
                    Коэффициент: <span id="current-mine-mult">1.00</span>x
                </div>

                <button id="btn-mines-action" onclick="handleMinesAction()" class="btn-tucha w-full bg-blue-500 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide">Играть</button>
            </div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="tab-profile" class="tab-content">
            <div class="flex flex-col items-center pt-6">
                <div id="tg-avatar" class="w-28 h-28 bg-slate-700 rounded-full mb-4 flex items-center justify-center text-5xl shadow-xl border-4 border-slate-600 overflow-hidden relative">👤</div>
                <h2 id="tg-name" class="text-3xl font-extrabold mb-1">Загрузка...</h2>
                
                <div class="bg-slate-800/80 px-8 py-3 rounded-2xl mt-4 mb-8 border border-slate-600 shadow-inner">
                    <span class="text-green-400 font-extrabold text-3xl">$<span id="profile-balance">0.00</span></span>
                </div>

                <button id="test-bonus-btn" onclick="claimTestBonus()" class="btn-tucha w-full bg-green-500 py-4 rounded-2xl font-extrabold text-lg uppercase tracking-wide mb-4 shadow-[0_0_20px_rgba(34,197,94,0.4)]">
                    🎁 Забрать $1.00 (<span id="bonus-left">2</span>/2)
                </button>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="fixed bottom-0 w-full bg-slate-900 border-t border-slate-700 pb-safe z-50">
        <div class="flex justify-around items-center p-2">
            <button onclick="switchTab('crash')" class="nav-btn text-blue-400 flex flex-col items-center p-2 transition-transform active:scale-95" data-tab="crash">
                <span class="text-3xl mb-1 drop-shadow-md flex items-center justify-center">
                    <img src="rocket.gif" class="w-8 h-8 object-contain" onerror="this.outerHTML='🚀'">
                </span>
                <span class="text-[11px] font-extrabold uppercase tracking-wide">Краш</span>
            </button>
            <button onclick="switchTab('mines')" class="nav-btn text-slate-500 flex flex-col items-center p-2 transition-transform active:scale-95" data-tab="mines">
                <span class="text-3xl mb-1 drop-shadow-md flex items-center justify-center">
                    <img src="bomb.png" class="w-8 h-8 object-contain" onerror="this.outerHTML='💣'">
                </span>
                <span class="text-[11px] font-extrabold uppercase tracking-wide">Мины</span>
            </button>
            <button onclick="switchTab('profile')" class="nav-btn text-slate-500 flex flex-col items-center p-2 transition-transform active:scale-95" data-tab="profile">
                <span class="text-3xl mb-1 drop-shadow-md">👤</span>
                <span class="text-[11px] font-extrabold uppercase tracking-wide">Профиль</span>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        let userId = "default_user";
        let userName = "Игрок";
        let userAvatarHTML = "👤";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = String(tg.initDataUnsafe.user.id);
            userName = tg.initDataUnsafe.user.first_name;
            if(tg.initDataUnsafe.user.photo_url) {
                userAvatarHTML = `<img src="${tg.initDataUnsafe.user.photo_url}" class="w-full h-full object-cover">`;
            }
        }

        const storageKeys = {
            balance: `tucha_balance_${userId}`,
            bonusCount: `tucha_bonus_count_${userId}`
        };

        let balance = parseFloat(localStorage.getItem(storageKeys.balance));
        if (isNaN(balance)) balance = 1.00; // Стартовый баланс 1 доллар

        let bonusCount = parseInt(localStorage.getItem(storageKeys.bonusCount)) || 0; // Доступно 2 активации

        function saveStats() {
            localStorage.setItem(storageKeys.balance, balance.toFixed(2));
            localStorage.setItem(storageKeys.bonusCount, bonusCount);
        }
        
        document.getElementById('tg-name').innerText = userName;
        document.getElementById('tg-avatar').innerHTML = userAvatarHTML;

        const bonusBtn = document.getElementById('test-bonus-btn');
        const bonusLeftSpan = document.getElementById('bonus-left');
        
        function updateBonusButton() {
            let left = 2 - bonusCount;
            if(left <= 0) {
                bonusBtn.style.display = 'none';
            } else {
                bonusLeftSpan.innerText = left;
            }
        }
        updateBonusButton();

        function updateBalanceDisplay() {
            const b = balance.toFixed(2);
            document.getElementById('header-balance').innerText = b;
            document.getElementById('profile-balance').innerText = b;
            saveStats();
        }

        function claimTestBonus() {
            if (bonusCount >= 2) return;
            balance += 1.00;
            bonusCount++;
            updateBonusButton();
            updateBalanceDisplay();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-400');
                btn.classList.add('text-slate-500');
                if (btn.dataset.tab === tabId) btn.classList.replace('text-slate-500', 'text-blue-400');
            });
            tg.HapticFeedback.impactOccurred('light');
        }

        // ================= РАКЕТКА =================
        let crashState = 'waiting'; 
        let currentCrashMult = 1.00;
        let userCrashBet = 0;
        let userInCrash = false;
        let targetCrashPoint = 1.00;
        let flyInterval = null;
        
        const rocketWrap = document.getElementById('rocket-wrap');
        const rocketImg = document.getElementById('rocket');
        const rktTimer = document.getElementById('crash-timer');
        const rktMult = document.getElementById('multiplier');
        const rktMsg = document.getElementById('crash-msg');
        const rktBtn = document.getElementById('btn-crash-action');
        const liveBetsContainer = document.getElementById('live-bets');
        const crashHistoryContainer = document.getElementById('crash-history');

        function generateFakeBets(includeUser = false, userAmount = 0) {
            const names = ['Саня', 'CryptoKing', 'Маша99', 'DarkPro', 'Иван', 'TuchaFan'];
            liveBetsContainer.innerHTML = '';
            
            if(includeUser) {
                liveBetsContainer.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-blue-900/50 rounded-xl border border-blue-500/50">
                        <span class="flex items-center gap-2"><span class="w-6 h-6 rounded-full overflow-hidden bg-slate-700 flex items-center justify-center text-xs">${userAvatarHTML}</span> <span class="text-white font-bold">${userName}</span></span>
                        <span class="text-green-400 font-bold">$${userAmount.toFixed(2)}</span>
                    </div>`;
            }

            for(let i=0; i<2; i++) {
                let name = names[Math.floor(Math.random()*names.length)];
                let amt = (Math.random() * 5 + 0.1).toFixed(2);
                liveBetsContainer.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-slate-900/50 rounded-xl">
                        <span class="flex items-center gap-2"><span class="text-xl">👤</span> <span class="text-slate-300">${name}</span></span>
                        <span class="text-yellow-400 font-bold">$${amt}</span>
                    </div>`;
            }
        }

        function addCrashHistory(mult) {
            const span = document.createElement('span');
            span.className = "bg-slate-800/50 px-3 py-1 rounded-full text-xs font-bold text-blue-400 border border-blue-900";
            span.innerText = mult.toFixed(2) + 'x';
            crashHistoryContainer.prepend(span);
            if(crashHistoryContainer.children.length > 6) {
                crashHistoryContainer.lastChild.remove();
            }
        }

        function startCrashLoop() {
            crashState = 'waiting';
            userInCrash = false;
            rocketWrap.style.display = 'none';
            rktMult.style.display = 'none';
            rktMsg.style.display = 'none';
            rktTimer.style.display = 'block';
            
            rktBtn.disabled = false;
            rktBtn.innerText = "СДЕЛАТЬ СТАВКУ";
            rktBtn.className = "btn-tucha w-full bg-blue-500 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide";
            
            generateFakeBets(false, 0);
            
            let timer = 5;
            rktTimer.innerText = `СТАРТ ЧЕРЕЗ ${timer}`;
            
            const countInterval = setInterval(() => {
                timer--;
                rktTimer.innerText = `СТАРТ ЧЕРЕЗ ${timer}`;
                if(timer <= 0) {
                    clearInterval(countInterval);
                    flyCrash();
                }
            }, 1000);
        }

        function flyCrash() {
            crashState = 'flying';
            rktTimer.style.display = 'none';
            rocketWrap.style.display = 'flex';
            rocketImg.className = 'rocket-img flying';
            rktMult.style.display = 'block';
            currentCrashMult = 1.00;
            
            targetCrashPoint = (Math.random() * 3.8 + 1.20).toFixed(2); 
            
            if(userInCrash) {
                rktBtn.disabled = false;
                rktBtn.innerText = `ЗАБРАТЬ $${(userCrashBet * currentCrashMult).toFixed(2)}`;
                rktBtn.className = "btn-tucha w-full bg-green-500 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide animate-pulse";
            } else {
                rktBtn.disabled = true;
                rktBtn.innerText = "ПОЛЁТ...";
                rktBtn.className = "btn-tucha w-full bg-slate-600 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide";
            }

            flyInterval = setInterval(() => {
                currentCrashMult += 0.01; 
                rktMult.innerText = currentCrashMult.toFixed(2) + 'x';
                
                if(userInCrash) {
                    rktBtn.innerText = `ЗАБРАТЬ $${(userCrashBet * currentCrashMult).toFixed(2)}`;
                }

                if (currentCrashMult >= targetCrashPoint) {
                    clearInterval(flyInterval);
                    doCrash();
                }
            }, 60);
        }

        function doCrash() {
            crashState = 'crashed';
            rocketImg.className = 'rocket-img crashed';
            rktMult.style.display = 'none';
            rktMsg.style.display = 'block';
            rktMsg.innerText = `КРАШ ${parseFloat(targetCrashPoint).toFixed(2)}x`;
            addCrashHistory(parseFloat(targetCrashPoint));
            tg.HapticFeedback.notificationOccurred('error');
            
            if(userInCrash) {
                userInCrash = false;
                userCrashBet = 0;
            }
            
            rktBtn.disabled = true;
            rktBtn.className = "btn-tucha w-full bg-slate-700 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide";
            rktBtn.innerText = "ПРОИГРЫШ";

            setTimeout(startCrashLoop, 3000);
        }

        function handleCrashAction() {
            if(crashState === 'waiting') {
                const bet = parseFloat(document.getElementById('crash-bet').value);
                if (bet > balance || bet <= 0 || isNaN(bet)) {
                    tg.HapticFeedback.notificationOccurred('error');
                    alert("Недостаточно средств или неверная ставка!"); return;
                }
                balance -= bet;
                userCrashBet = bet;
                userInCrash = true;
                updateBalanceDisplay();
                
                generateFakeBets(true, bet);
                
                rktBtn.innerText = "СТАВКА ПРИНЯТА (ОЖИДАНИЕ)";
                rktBtn.className = "btn-tucha w-full bg-slate-600 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide";
                tg.HapticFeedback.impactOccurred('medium');
            } 
            else if(crashState === 'flying' && userInCrash) {
                const win = userCrashBet * currentCrashMult;
                balance += win;
                userInCrash = false;
                updateBalanceDisplay();
                
                rktBtn.disabled = true;
                rktBtn.innerText = `ВЫИГРАНО $${win.toFixed(2)}`;
                rktBtn.className = "btn-tucha w-full bg-green-600 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide";
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        // ================= МИНЫ (ИСПРАВЛЕННЫЕ ЧИСТЫЕ ЯЧЕЙКИ) =================
        let minesGameState = 'idle'; 
        let minesPositions = [];
        let currentMineBet = 0;
        let currentMineMult = 1.00;
        let safeClicksCount = 0;
        let totalBombs = 3;

        const mGrid = document.getElementById('mines-grid');
        const mBtn = document.getElementById('btn-mines-action');
        const mMultDisp = document.getElementById('mines-multiplier-display');
        const mMultVal = document.getElementById('current-mine-mult');

        function buildMinesGrid() {
            mGrid.innerHTML = ''; 
            for(let i=0; i<25; i++) {
                let div = document.createElement('div');
                div.className = 'mine-cell';
                div.dataset.index = i;
                // Изначально ячейки абсолютно чистые без наложений
                div.innerHTML = '';
                mGrid.appendChild(div);
            }
        }

        buildMinesGrid(); 

        function handleMinesAction() {
            if(minesGameState === 'idle') {
                const bet = parseFloat(document.getElementById('mines-bet').value);
                if (bet > balance || bet <= 0 || isNaN(bet)) {
                    tg.HapticFeedback.notificationOccurred('error');
                    alert("Недостаточно средств или неверная ставка!"); return;
                }
                
                buildMinesGrid(); 
                
                balance -= bet;
                updateBalanceDisplay();
                
                totalBombs = parseInt(document.getElementById('mines-slider').value);
                currentMineBet = bet;
                currentMineMult = 1.00;
                safeClicksCount = 0;
                minesGameState = 'playing';
                
                minesPositions = [];
                while(minesPositions.length < totalBombs) {
                    let r = Math.floor(Math.random() * 25);
                    if(!minesPositions.includes(r)) minesPositions.push(r);
                }

                mMultDisp.style.display = 'block';
                mMultVal.innerText = currentMineMult.toFixed(2);
                mBtn.innerText = "ВЫБЕРИТЕ ЯЧЕЙКУ";
                mBtn.disabled = true;
                mBtn.className = "btn-tucha w-full bg-slate-600 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide";

                const cells = document.querySelectorAll('.mine-cell');
                cells.forEach(cell => {
                    cell.onclick = () => clickMine(parseInt(cell.dataset.index), cell);
                });
            } else if (minesGameState === 'playing') {
                const win = currentMineBet * currentMineMult;
                balance += win;
                updateBalanceDisplay();
                tg.HapticFeedback.notificationOccurred('success');
                endMinesGame(`ВЫИГРЫШ $${win.toFixed(2)}`, 'bg-green-500');
            }
        }

        function clickMine(index, cellEl) {
            if(minesGameState !== 'playing') return;
            
            cellEl.onclick = null; 
            
            if(minesPositions.includes(index)) {
                cellEl.classList.add('bomb');
                // Ставим красивый кристал или бомбу через картинку или эмодзи
                cellEl.innerHTML = `<img src="bomb.png" class="w-8 h-8 object-contain" onerror="this.outerHTML='💣'">`;
                tg.HapticFeedback.notificationOccurred('error');
                
                document.querySelectorAll('.mine-cell').forEach((c, i) => {
                    c.onclick = null;
                    if(minesPositions.includes(i) && i !== index) {
                        c.classList.add('bomb');
                        c.innerHTML = `<img src="bomb.png" class="w-8 h-8 object-contain opacity-50" onerror="this.outerHTML='💣'">`;
                    }
                });
                endMinesGame("ПРОИГРЫШ", 'bg-red-500');
            } else {
                cellEl.classList.add('safe');
                cellEl.innerHTML = `<img src="star.png" class="w-8 h-8 object-contain" onerror="this.outerHTML='💎'">`;
                tg.HapticFeedback.impactOccurred('medium');
                
                safeClicksCount++;
                
                let prob = 1.0;
                for(let i = 0; i < safeClicksCount; i++) {
                    prob *= (25 - totalBombs - i) / (25 - i);
                }
                const houseEdge = 0.95; 
                currentMineMult = (houseEdge / prob);
                
                mMultVal.innerText = currentMineMult.toFixed(2);
                
                const currentWin = currentMineBet * currentMineMult;
                mBtn.disabled = false;
                mBtn.innerText = `ЗАБРАТЬ $${currentWin.toFixed(2)}`;
                mBtn.className = "btn-tucha w-full bg-green-500 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide";
                
                if(safeClicksCount === (25 - totalBombs)) {
                    balance += currentWin;
                    updateBalanceDisplay();
                    endMinesGame(`СУПЕР ВЫИГРЫШ $${currentWin.toFixed(2)}`, 'bg-yellow-500');
                }
            }
        }

        function endMinesGame(msg, colorClass) {
            minesGameState = 'idle';
            mBtn.innerText = msg;
            mBtn.disabled = false;
            mBtn.className = `btn-tucha w-full ${colorClass} text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide`;
            
            setTimeout(() => {
                if(minesGameState === 'idle') {
                    mMultDisp.style.display = 'none';
                    mBtn.innerText = "ИГРАТЬ";
                    mBtn.className = "btn-tucha w-full bg-blue-500 text-white font-extrabold py-4 rounded-2xl text-xl uppercase tracking-wide";
                }
            }, 3000);
        }

        updateBalanceDisplay();
        startCrashLoop(); 
    </script>
</body>
</html>
